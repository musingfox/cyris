name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Both Worker suites run from pytest (tests/test_worker_js_suite.py):
      # `workers/app/` under vitest, `workers/rss/` under `node --test`. Each
      # skips when its runner is missing, so without a toolchain here that skip
      # was silent and no Worker JS ran in CI at all.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: uv sync --dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run pytest
