name: Deploy the container Worker

# Dispatch-only, and separate from the image build on purpose. Building and
# deploying fail in different ways — "the image cannot be made" and "the image
# cannot go live" — and chaining them would collapse both into one red X.
# Separate also means the timing is chosen: `wrangler.toml` runs a cron every
# hour, and a deploy rolls the container, so landing one at 07:59 is a choice
# nobody should make by accident.
#
# Pinning is this workflow, not a re-dispatch of the build: release-image.yml
# refuses to republish a commit, because the image is not reproducible. Going
# back means naming an image already in the registry — pass its digest as
# image_tag, and this deploys that exact image with no build at all.
#
# That reach starts at the IMAGE_NAME below. It changed on 2026-09-21, so every
# digest this workflow recorded before then names an image in the previous
# repository and no longer resolves — including `:release`, which is this
# workflow's own default. Until release-image.yml has run once under the new
# name there is nothing here to deploy, and the resolve step says so rather
# than deploying something older.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Registry tag, or sha256:… digest to pin to one exact image'
        required: true
        default: release

# Two dispatches would race each other's `wrangler deploy` and the container
# rollout behind it. Serialise rather than cancel: cancelling mid-deploy is
# what would leave the Worker and its container application disagreeing.
concurrency:
  group: deploy-app
  cancel-in-progress: false

env:
  # Must equal `[[containers]] name` in wrangler.toml: that is the repository a
  # local `wrangler deploy` pushes to, and pointing the same container
  # application at two repositories lets either path silently serve the other's
  # older image. tests/test_deploy_inputs.py holds them together.
  IMAGE_NAME: cyris-app-cyriscontainer

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # `wrangler deploy` bundles the Worker, and workers/app/src/index.js imports
      # @cloudflare/containers. Without this the bundle fails on a missing module
      # — the first dispatch died exactly here, after the image had been resolved.
      - id: deps
        run: bun install --frozen-lockfile
      # `wrangler containers push` resolves the account from the API token when
      # this is empty, so a deploy would render "registry.cloudflare.com//…" and
      # fail somewhere less legible. Refuse before anything is rendered.
      - id: preflight
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "repository variable CLOUDFLARE_ACCOUNT_ID is unset" >&2
            exit 1
          fi
      - id: registry_login
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CONTAINERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          credentials=$(npx wrangler containers registries credentials registry.cloudflare.com --pull --json)
          printf '%s' "$credentials" | jq -r .password | docker login registry.cloudflare.com \
            --username "$(printf '%s' "$credentials" | jq -r .username)" --password-stdin
      # The digest is read before the deploy so the run records which image went
      # live even when `image_tag` was the mutable `release` — six months later
      # that tag says nothing about what was deployed today.
      - id: resolve
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          image="registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/$IMAGE_NAME"
          case "${{ inputs.image_tag }}" in
            sha256:*) ref="$image@${{ inputs.image_tag }}" ;;
            *) ref="$image:${{ inputs.image_tag }}" ;;
          esac
          # -v yields an array when a reference resolves to an index.
          descriptor='if type == "array" then .[0] else . end | .Descriptor.digest // empty'
          digest=$(docker manifest inspect -v "$ref" | jq -r "$descriptor")
          if [ -z "$digest" ]; then
            echo "the registry serves no image for $ref" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "deploying $ref ($digest)"
      - id: derive
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          scripts/derive-wrangler-config.sh "$CLOUDFLARE_ACCOUNT_ID" "$IMAGE_NAME" \
            "${{ inputs.image_tag }}" wrangler.deploy.toml
          grep '^image = ' wrangler.deploy.toml
      # --containers-rollout immediate: the instance types and limits are
      # unchanged by a deploy that only moves the image, and a gradual rollout
      # would leave two images serving at once — which is exactly the state
      # `cyris doctor --deployment` could not describe.
      - id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CONTAINERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler deploy --config wrangler.deploy.toml
          --containers-rollout immediate --env-file /dev/null
      # The derived file is a build artifact. Nothing here commits it, and
      # nothing should: it carries the account id the tracked config must not.
      - id: receipt
        run: |
          echo "deployed $IMAGE_NAME@${{ steps.resolve.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
      # A green deploy means the rollout started, not that the new image serves, so the
      # job fails unless production names the commit baked into the digest it was given.
      # The first ask waits: each request renews a warm instance's five idle minutes, and
      # a warm instance keeps answering from the image it started with. The session
      # cookie is sha256 of the token, a credential GitHub does not know to mask, and
      # this repository's logs are public.
      - id: verify
        env:
          CYRIS_UI_TOKEN: ${{ secrets.CYRIS_UI_TOKEN }}
          CYRIS_DEPLOYMENT_URL: ${{ vars.CYRIS_DEPLOYMENT_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          if [ -z "$CYRIS_UI_TOKEN" ] || [ -z "$CYRIS_DEPLOYMENT_URL" ]; then
            echo "secret CYRIS_UI_TOKEN and variable CYRIS_DEPLOYMENT_URL are needed to verify" >&2
            exit 1
          fi
          ref="registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/$IMAGE_NAME@$DIGEST"
          docker pull -q --platform linux/amd64 "$ref" > /dev/null
          expected=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$ref" \
            | sed -n 's/^CYRIS_GIT_SHA=//p')
          if [ -z "$expected" ]; then
            echo "the deployed image names no commit, so nothing can be compared" >&2
            exit 1
          fi
          echo "::add-mask::$(printf '%s' "$CYRIS_UI_TOKEN" | sha256sum | cut -d' ' -f1)"
          base="${CYRIS_DEPLOYMENT_URL%/}"
          jar="$RUNNER_TEMP/cyris-ui.cookies"
          trap 'rm -f "$jar"' EXIT
          online=""
          for attempt in 1 2; do
            sleep 360
            online=$(printf '%s' "$CYRIS_UI_TOKEN" \
              | curl -sSf -m 120 -c "$jar" -o /dev/null --data-urlencode "token@-" "$base/login" \
              && curl -sSf -m 120 -b "$jar" "$base/api/build" | jq -r '.git_sha // empty') \
              || online=""
            echo "attempt $attempt: production reports ${online:-nothing}, deployed ${expected}"
            [ "$online" = "$expected" ] && break
          done
          if [ "$online" != "$expected" ]; then
            echo "production does not report the deployed commit $expected" >&2
            exit 1
          fi
          echo "production reports $expected, the deployed commit" >> "$GITHUB_STEP_SUMMARY"
