name: Release container image

on:
  workflow_dispatch:

# Two mutable remote tags are written here (`:release` in the registry, and nothing
# else). Overlapping dispatches would interleave their pushes and could leave
# `:release` on the older commit, so the job is serialised rather than cancelled —
# cancelling mid-push is what would leave a half-moved tag.
concurrency:
  group: release-image
  cancel-in-progress: false

env:
  # Must equal `[[containers]] name` in wrangler.toml: that is the repository a
  # local `wrangler deploy` pushes to, and pointing the same container
  # application at two repositories lets either path silently serve the other's
  # older image. tests/test_deploy_inputs.py holds them together.
  IMAGE_NAME: cyris-app-cyriscontainer

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-tags so the git_tag step's idempotence check can see an existing tag;
      # checkout's default init+fetch --no-tags lands none, and the push is then rejected.
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
      - id: check
        run: scripts/check.sh
      # `wrangler containers push` resolves the account from the API token when this is
      # empty, so both pushes would succeed and only the digest read-back would fail —
      # after `:release` had already moved. Refuse before anything is published.
      - id: preflight
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "repository variable CLOUDFLARE_ACCOUNT_ID is unset" >&2
            exit 1
          fi
      # Needs the container-registry-push permission. Verified sufficient on 2026-09-15 by
      # a real dispatch: Account -> Workers Scripts:Edit plus the Containers entry in the
      # token picker. The picker's exact label for that second entry is not recorded here.
      - id: registry_login
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CONTAINERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          credentials=$(npx wrangler containers registries credentials registry.cloudflare.com --pull --json)
          printf '%s' "$credentials" | jq -r .password | docker login registry.cloudflare.com \
            --username "$(printf '%s' "$credentials" | jq -r .username)" --password-stdin
      # The image is not reproducible — the base is a moving tag and the apt packages are
      # unpinned — so rebuilding a commit publishes a different image under the same
      # `:<sha>`. Refuse: an already-published commit is a no-op that only re-checks its
      # own provenance. Moving `:release` backwards is the deploy path's pinning edit,
      # not a re-dispatch of this workflow.
      - id: existing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          image="registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/$IMAGE_NAME"
          digest=$(docker manifest inspect -v "$image:${{ github.sha }}" 2>/dev/null \
            | jq -r 'if type == "array" then .[0] else . end | .Descriptor.digest // empty') || digest=""
          if [ -n "$digest" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "$IMAGE_NAME:${{ github.sha }} already published as $digest; skipping build and push"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      # Docker supplies TARGETARCH to the Dockerfile's checked supercronic download, and
      # linux/amd64 is pinned because that is the architecture Cloudflare Containers runs.
      - id: build
        if: steps.existing.outputs.published != 'true'
        run: >-
          docker build --platform linux/amd64 --build-arg GIT_SHA=${{ github.sha }}
          -t "$IMAGE_NAME:${{ github.sha }}" .
      # The image installs with --no-dev, so a runtime import that only the dev group
      # satisfies passes check.sh and fails at the first cron tick. Importing every
      # module here catches it before anything is pushed. `cyris.__main__` is skipped
      # because importing it runs the CLI.
      - id: smoke
        if: steps.existing.outputs.published != 'true'
        run: |
          image="$IMAGE_NAME:${{ github.sha }}"
          docker run --rm --entrypoint sh "$image" -c 'test "$CYRIS_GIT_SHA" = "${{ github.sha }}"'
          docker run --rm "$image" cyris --help > /dev/null
          docker run --rm -i "$image" python - <<'EOF'
          import importlib, pkgutil, cyris
          names = [m.name for m in pkgutil.walk_packages(cyris.__path__, "cyris.")
                   if not m.name.endswith(".__main__")]
          for name in names:
              importlib.import_module(name)
          print(f"imported {len(names)} cyris modules")
          EOF
      # Needs the container-registry-push permission. Verified sufficient on 2026-09-15 by
      # a real dispatch: Account -> Workers Scripts:Edit plus the Containers entry in the
      # token picker. The picker's exact label for that second entry is not recorded here.
      - id: push_sha
        if: steps.existing.outputs.published != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CONTAINERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler containers push "$IMAGE_NAME:${{ github.sha }}"
      # The immutable tag is confirmed in the registry before the mutable one moves, so a
      # failure here leaves `:release` where it was.
      - id: verify_sha
        if: steps.existing.outputs.published != 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          image="registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/$IMAGE_NAME"
          # -v yields an array when a tag resolves to an index (provenance attestations do this).
          descriptor='if type == "array" then .[0] else . end | .Descriptor.digest // empty'
          sha_digest=$(docker manifest inspect -v "$image:${{ github.sha }}" | jq -r "$descriptor")
          if [ -z "$sha_digest" ]; then
            echo "pushed $IMAGE_NAME:${{ github.sha }} but the registry serves no digest for it" >&2
            exit 1
          fi
          echo "digest=$sha_digest" >> "$GITHUB_OUTPUT"
      # Needs the container-registry-push permission. Verified sufficient on 2026-09-15 by
      # a real dispatch: Account -> Workers Scripts:Edit plus the Containers entry in the
      # token picker. The picker's exact label for that second entry is not recorded here.
      - id: push_release
        if: steps.existing.outputs.published != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CONTAINERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          docker tag "$IMAGE_NAME:${{ github.sha }}" "$IMAGE_NAME:release"
          npx wrangler containers push "$IMAGE_NAME:release"
      - id: digest
        if: steps.existing.outputs.published != 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          image="registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/$IMAGE_NAME"
          descriptor='if type == "array" then .[0] else . end | .Descriptor.digest // empty'
          sha_digest=${{ steps.verify_sha.outputs.digest }}
          release_digest=$(docker manifest inspect -v "$image:release" | jq -r "$descriptor")
          if [ -z "$release_digest" ] || [ "$sha_digest" != "$release_digest" ]; then
            echo "registry tags empty or differ: sha=$sha_digest release=$release_digest" >&2
            exit 1
          fi
          echo "digest=$sha_digest" >> "$GITHUB_OUTPUT"
      # The tag records which image a commit produced. When the commit already carried a
      # tag, the recorded digest must still be the one the registry serves — a silent
      # disagreement there is exactly the question this tag exists to answer.
      - id: git_tag
        run: |
          tag="image/${GITHUB_SHA::7}"
          digest="${{ steps.digest.outputs.digest }}"
          if [ -z "$digest" ]; then
            digest="${{ steps.existing.outputs.digest }}"
          fi
          if [ -z "$digest" ]; then
            echo "no image digest to record" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            test "$(git rev-list -n 1 "$tag")" = "${{ github.sha }}" || {
              echo "$tag points at another commit" >&2
              exit 1
            }
            recorded=$(git tag -l --format='%(contents)' "$tag")
            case "$recorded" in
              *"$digest"*) exit 0 ;;
              *)
                echo "$tag records a digest the registry no longer serves: want $digest" >&2
                echo "recorded: $recorded" >&2
                exit 1
                ;;
            esac
          fi
          git tag -a "$tag" "${{ github.sha }}" \
            -m "This commit has an image. commit=${{ github.sha }} digest=$digest"
          git push origin "$tag"
