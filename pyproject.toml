[project]
name = "cyris"
version = "0.1.0"
description = "AI-powered information digest agent"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "musingfox" }]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
    "aiohttp>=3.10",
    "anthropic>=0.52",
    "httpx>=0.28",
    "jinja2>=3.1",
    "miniflux>=1.0",
    "pydantic>=2.10",
    "tomli>=2.2; python_version < '3.11'",
    "trafilatura>=2.0",
    "typer>=0.15",
    "pyyaml>=6.0",
    "feedparser>=6.0.14",
]

[project.optional-dependencies]
paywall = [
    "browser-cookie3>=0.19",
]

[project.scripts]
cyris = "cyris.entrypoints.cli:app"

[project.urls]
Repository = "https://github.com/musingfox/cyris"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyris"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7.1.0",
    "respx>=0.21",
    "ruff>=0.9",
]
