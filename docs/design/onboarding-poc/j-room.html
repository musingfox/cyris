<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crowded room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root {
  /* backgrounds, deepest to lightest */
  --bg: #07070a;
  --bg-elev: #0d0d12;
  --surface: #11111a;
  --surface-2: #161622;
  /* lines */
  --border: #1f1f2e;
  --border-strong: #2a2a40;
  /* text */
  --text: #ebebf2;
  --text-dim: #8a8aa0;
  --text-faint: #62627a;
  /* semantic */
  --accent: #c6ff3d;
  --accent-dim: #8aa829;
  --warn: #ff5b8a;
  --accent-tint: rgba(198, 255, 61, 0.07);
  --warn-tint: rgba(255, 91, 138, 0.12);
  --grid: rgba(198, 255, 61, 0.035);
  /* spacing */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px;  --s-4: 16px;  --s-5: 20px;
  --s-6: 24px; --s-8: 32px; --s-12: 48px; --s-16: 64px; --s-20: 80px;
  /* fonts and the type scale multiplier */
  --font-sans: 'Geist', system-ui, -apple-system, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, monospace;
  --font-serif: 'Instrument Serif', Georgia, serif;
  --type-scale: 1;
  /* shape, motion, layout */
  --r-control: 6px;
  --r-tag: 999px;
  --t-fast: 150ms ease-out;
  --bar-h: 60px;
  --measure: 640px;
  --measure-wide: 760px;
}
/* POC only: the typographic motion and the room heights need values the spec has no token for. */
:root { --t-word: 520ms; --t-leave: 260ms; --t-scene: 600ms;
  --room-tall: 300px; --room-short: 150px; --room-mid: 230px; }
@media (min-width: 720px) { :root { --room-tall: 380px; --room-short: 210px; --room-mid: 280px; } }

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

.page { max-width: var(--measure-wide); margin: 0 auto; padding: var(--s-5) var(--s-4) var(--s-12); min-height: 100vh; }
@media (min-width: 720px) { .page { padding: var(--s-8) var(--s-6) var(--s-16); } }
.top { display: flex; justify-content: space-between; align-items: center; height: var(--s-8); }
.brand { display: flex; align-items: center; gap: var(--s-2); font-family: var(--font-mono); font-weight: 500;
  font-size: calc(12px * var(--type-scale)); letter-spacing: .1em; text-transform: uppercase; color: var(--text); }
.brand i { width: 12px; height: 12px; background: var(--accent); box-shadow: 0 0 12px rgba(198,255,61,.45); }
.label { font-family: var(--font-mono); font-weight: 500; font-size: calc(12px * var(--type-scale));
  letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); }
.data { font-family: var(--font-mono); font-size: calc(14px * var(--type-scale)); font-variant-numeric: tabular-nums; color: var(--text-dim); }

.stage { margin-top: var(--s-8); transition: opacity var(--t-leave) ease-in, transform var(--t-leave) ease-in; }
.stage.leaving { opacity: 0; transform: translateY(calc(-1 * var(--s-6))); }

/* the editor's sentence, assembled word by word (from e-stream-letter) */
.say { font-family: var(--font-serif); font-weight: 400; font-size: calc(clamp(30px, 5.2vw, 48px) * var(--type-scale));
  line-height: 1.14; letter-spacing: -0.02em; margin: 0 auto; overflow-wrap: anywhere; text-align: center; max-width: var(--measure); }
.say.dense { font-size: calc(clamp(24px, 3.9vw, 34px) * var(--type-scale)); line-height: 1.3; letter-spacing: -0.01em; }
.say em { font-style: italic; color: var(--accent); }
.say em[lang] { font-style: normal; }
.w { display: inline-block; animation: assemble var(--t-word) ease-out both; }
.say.still .w { animation: fade var(--t-leave) ease-out both; animation-delay: 0s !important; }
@keyframes assemble { from { opacity: 0; transform: translateY(.35em); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.claim .then { opacity: 0; transition: opacity var(--t-scene) ease-out; }
.claim.cleared .then { opacity: 1; }
.blank { font: inherit; letter-spacing: inherit; color: var(--text-dim); background: none; border: 0;
  border-bottom: 1px solid var(--border-strong); padding: 2px .06em; margin: 0; cursor: pointer;
  transition: color var(--t-fast), border-color var(--t-fast), opacity var(--t-fast); }
.blank:hover { color: var(--text); }
.blank:active { opacity: .7; }
.blank:disabled { cursor: default; }
.blank[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); }
input.blank, select.blank { cursor: text; color: var(--accent); border-bottom-color: var(--accent-dim); border-radius: 0;
  -webkit-appearance: none; appearance: none; text-align: center; }
input.blank:focus, select.blank:focus { outline: none; border-bottom-color: var(--accent); }
input.blank::placeholder { color: var(--text-dim); font-style: italic; }
input.blank.hour { width: 1.6em; -moz-appearance: textfield; }
input.blank.hour::-webkit-inner-spin-button, input.blank.hour::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input.blank.wide { width: min(100%, 9em); }
input.blank[aria-invalid="true"] { border-bottom-color: var(--warn); }
select.blank { cursor: pointer; background: none; padding-right: .1em; max-width: 100%; }
select.blank option { font-family: var(--font-sans); font-size: 16px; background: var(--bg-elev); color: var(--text); }
.quiet { display: flex; gap: var(--s-8); margin-top: var(--s-5); flex-wrap: wrap; justify-content: center; }
.hint { font-size: calc(14px * var(--type-scale)); line-height: 1.5; color: var(--text-dim); margin: var(--s-4) auto 0; text-align: center; max-width: 34em; }
.hint.warn { color: var(--warn); }
.hint.lead { margin: 0 auto var(--s-4); }

/* the room: one canvas of voices, clear ones in front, the murmur behind */
.room { margin: var(--s-6) auto 0; max-width: var(--measure-wide); background: var(--bg);
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.room canvas { display: block; width: 100%; height: var(--room-mid); }
.room.tall canvas { height: var(--room-tall); }
.room.short canvas { height: var(--room-short); }
.room.sticky { position: sticky; top: 0; z-index: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* the feed picker: topic filters and feeds on one screen */
.filters, .feeds { display: flex; flex-wrap: wrap; gap: var(--s-2); justify-content: center; }
.filters { margin-top: var(--s-5); }
.feeds { margin-top: var(--s-4); }
.chip { min-height: 36px; padding: 0 var(--s-3); border-radius: var(--r-tag); border: 1px solid var(--border-strong);
  background: var(--surface); color: var(--text-dim); cursor: pointer; display: inline-flex; align-items: center; gap: var(--s-2);
  font-family: var(--font-sans); font-size: calc(14px * var(--type-scale));
  transition: color var(--t-fast), border-color var(--t-fast), background-color var(--t-fast); }
.chip:hover { color: var(--text); }
.chip.filter { font-family: var(--font-mono); font-weight: 500; font-size: calc(12px * var(--type-scale)); letter-spacing: .1em; text-transform: uppercase; background: none; }
.chip[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-tint); }
.chip .n { font-family: var(--font-mono); font-size: calc(12px * var(--type-scale)); color: var(--text-dim); }
.own { display: flex; gap: var(--s-2); margin: var(--s-6) auto 0; max-width: 34em; flex-wrap: wrap; align-items: flex-end; }
.own label { width: 100%; }
.field { flex: 1; min-width: 0; height: 44px; padding: 0 var(--s-3); border-radius: var(--r-control); border: 1px solid var(--border-strong);
  background: var(--bg-elev); color: var(--text); font-family: var(--font-mono); font-size: 16px; }
.field:focus { outline: none; border-color: var(--accent); }
.field[aria-invalid="true"] { border-color: var(--warn); }

.nav { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-3); margin-top: var(--s-8); }
.nav.sticky { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--border); padding: var(--s-3) 0; margin-top: var(--s-6); }
.nav .grow { flex: 1; }
.btn { height: 44px; padding: 0 var(--s-5); font-family: var(--font-mono); font-weight: 500; font-size: calc(12px * var(--type-scale));
  text-transform: uppercase; letter-spacing: .1em; border-radius: var(--r-control); border: 1px solid transparent; cursor: pointer;
  transition: background-color var(--t-fast), color var(--t-fast), border-color var(--t-fast), opacity var(--t-fast); }
.btn.primary { background: var(--accent); color: var(--bg); }
.btn.primary:hover { background: #d4ff66; }
.btn.secondary { background: var(--surface-2); border-color: var(--border-strong); color: var(--text-dim); }
.btn.secondary:hover { color: var(--text); }
.btn:active { opacity: .7; }
.btn:disabled { opacity: .4; cursor: default; }

/* the first issue: the whole screen, three labelled layers (from e-stream-letter) */
.issue { margin-top: var(--s-4); }
.issue.appear { animation: fade var(--t-scene) ease-out both; }
.issue-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-4); flex-wrap: wrap;
  border-bottom: 1px solid var(--border); padding-bottom: var(--s-4); margin-bottom: var(--s-6); }
.issue-title { font-family: var(--font-serif); font-weight: 400; font-size: calc(clamp(56px, 8.75vw, 119px) * var(--type-scale)); line-height: .92; letter-spacing: -0.04em; margin: 0; }
.layer { margin-top: var(--s-12); }
.layer-head { margin: 0 0 var(--s-4); }
.marker { display: flex; align-items: center; gap: var(--s-3); margin: 0 0 var(--s-2); }
.marker::before { content: ""; width: 24px; height: 1px; background: var(--accent); }
.layer-head p { margin: 0; font-size: calc(14px * var(--type-scale)); line-height: 1.5; color: var(--text-dim); }
.item { background: var(--bg-elev); border: 1px solid var(--border); padding: var(--s-4) var(--s-5); display: grid; gap: var(--s-1); }
.item + .item { border-top: 0; }
.item h3 { font-size: calc(18px * var(--type-scale)); font-weight: 600; line-height: 1.3; margin: 0; }
.item.deep h3 { font-size: calc(19px * var(--type-scale)); }
.item p { margin: 0; font-size: calc(14px * var(--type-scale)); line-height: 1.5; color: var(--text-dim); }
.item .more { color: var(--accent); }
.frags { border: 1px solid var(--border); background: var(--bg-elev); }
.frags div { display: flex; justify-content: space-between; gap: var(--s-4); padding: var(--s-3) var(--s-5); border-bottom: 1px solid var(--border);
  font-size: calc(14px * var(--type-scale)); line-height: 1.5; }
.frags div:last-child { border-bottom: 0; }
.frags .label { flex: none; }
.empty { font-size: calc(14px * var(--type-scale)); color: var(--text-dim); margin: 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<main class="page">
  <div class="top"><span class="brand"><i aria-hidden="true"></i>Cyris</span><span class="label" id="progress"></span></div>
  <div class="stage" id="stage" aria-live="polite"></div>
</main>
<script>
"use strict";
const RM = window.matchMedia("(prefers-reduced-motion: reduce)");

/* ---- fake data: names and topics from src/cyris/onboarding_feeds.json ---- */
const TOPICS = [
  { id: "tech", label: "Technology" },
  { id: "business", label: "Business & economy" },
  { id: "world", label: "World" },
  { id: "taiwan", label: "Taiwan" },

  { id: "ideas", label: "Ideas & culture" },
];
/* POC only: `voices` is how many headlines a feed says into the room, a rough guess at its volume; it is never shown. */
const FEEDS = [
  ["中央社即時新聞 政治新聞", ["taiwan"], 5], ["中央社即時新聞 科技新聞", ["tech", "taiwan"], 4], ["報導者", ["taiwan", "ideas"], 2],

  ["科技新報", ["tech"], 4], ["INSIDE", ["tech", "business"], 3], ["BBC中文網 繁體", ["world"], 4], ["紐約時報中文網 繁體", ["world"], 3],
  ["RFI 法國國際廣播電台 繁體", ["world"], 4], ["明報新聞網", ["world"], 5], ["RTHK 香港電台", ["world"], 5], ["經濟日報", ["business", "taiwan"], 6],
  ["換日線", ["ideas", "world"], 2], ["電腦王阿達", ["tech"], 3], ["BBC News", ["world"], 5], ["The New York Times", ["world"], 5],
  ["The Guardian", ["world"], 6], ["NPR", ["world"], 4], ["The Verge", ["tech"], 4], ["Ars Technica", ["tech"], 4],
  ["The Economist", ["world", "business"], 3], ["Financial Times", ["business", "world"], 5], ["Bloomberg", ["business"], 5],
  ["Hacker News", ["tech"], 4], ["Techmeme", ["tech"], 4], ["數位時代", ["tech", "business"], 3], ["Gea-Suan Lin's BLOG", ["tech"], 2],
  ["Simon Willison's Weblog", ["tech"], 2], ["Daring Fireball", ["tech"], 2], ["Stratechery", ["tech", "business"], 2],
  ["ChinaTalk", ["world", "tech"], 2], ["市場先生", ["business"], 2], ["股感 StockFeel", ["business"], 2], ["Marginal Revolution", ["business"], 2],
  ["Noahpinion", ["business", "world"], 2], ["Paul Krugman", ["business"], 2], ["端傳媒", ["world", "taiwan"], 2],
  ["Global Taiwan Institute", ["taiwan", "world"], 2], ["台灣事實查核中心", ["taiwan"], 2], ["Focus Taiwan (CNA English)", ["taiwan"], 4],
  ["Taiwan Insight", ["taiwan"], 2], ["泛科學 PanSci", ["science"], 2], ["CASE 報科學", ["science"], 2], ["Quanta Magazine", ["science"], 2],
  ["Nautilus", ["science", "ideas"], 2], ["Aeon", ["ideas", "science"], 2], ["Readmoo 閱讀最前線", ["ideas"], 2], ["OKAPI 閱讀生活誌", ["ideas"], 2],
  ["The Marginalian", ["ideas"], 2], ["The Atlantic Ideas", ["ideas"], 2], ["Dezeen", ["ideas"], 3], ["Lenny's Newsletter", ["business", "tech"], 2],

const STANCE_POOL = {
  tech: ["台積電美國廠", "AI 代理", "開源授權"],
  business: ["美國關稅", "央行利率", "輝達財報"],

  taiwan: ["總預算審查", "罷免投票", "健保費率調整"],
  science: ["登革熱疫情", "減重藥物", "韋伯望遠鏡"],
  ideas: ["獨立書店", "長照人力", "AI 與著作權"],

/* what each topic's voices say in the room: headline fragments, all fake */
const LINES = {
  "台積電美國廠": ["台積電美國新廠提前量產，良率仍待追上", "亞利桑那廠人力吃緊，工程師輪調延長"],

  "開源授權": ["開源授權改版爭議：社群為何出走", "資料庫專案改授權，雲端業者另起分支"],
  "美國關稅": ["關稅上路之後，出口商怎麼調整供應鏈", "關稅豁免清單出爐，電子業鬆一口氣"],

  "總預算審查": ["總預算審查卡關，地方建設經費延宕", "立法院臨時會再議總預算，朝野各有盤算"],
  "罷免投票": ["罷免投票前夕，雙方動員進入最後階段", "罷免投票率成焦點，選委會加開投票所"],
  "健保費率調整": ["健保費率調整案：誰多付、誰少付", "健保財務吃緊，部分負擔改制再起爭論"],
  "登革熱疫情": ["登革熱南部疫情升溫，社區孳生源是關鍵", "登革熱疫苗審查進度，專家看法分歧"],
  "減重藥物": ["減重藥物的長期數據：停藥後會怎樣", "減重藥物缺貨，醫師提醒勿自行購買"],
  "韋伯望遠鏡": ["韋伯望遠鏡看見最早的星系團", "韋伯新影像：系外行星大氣裡的水氣"],
  "獨立書店": ["獨立書店的第三種活法", "書店結合咖啡與講座，能撐多久"],
  "長照人力": ["長照人力缺口：移工之外還有什麼路", "照服員薪資調整，留任率仍低"],
  "AI 與著作權": ["生成式 AI 與著作權：法院怎麼看", "出版社聯名提告，要求揭露訓練資料"],
};
const LANGS = ["Traditional Chinese", "Simplified Chinese", "English", "Japanese"];
const LANG_TAG = { "Traditional Chinese": "zh-Hant", "Simplified Chinese": "zh-Hans", English: "en", Japanese: "ja" };

function hash(s) { let h = 7; for (const c of s) h = (h * 31 + c.codePointAt(0)) % 9973; return h; }
const feedRec = name => FEEDS.find(f => f.name === name);
const topicOf = name => feedRec(name)?.topics[0] || "tech";
const isLatin = s => /^[\x00-\x7f’]+$/.test(s);

/* ---- state; a step opened by hash fills in what the steps before it would have ---- */
const STEPS = ["opening", "feeds", "lanes", "fetch", "stances", "issue", "settings"];
const STEP_NAME = { opening: "Welcome", feeds: "Sources", lanes: "Never miss", fetch: "Listening", stances: "Topics", issue: "First issue", settings: "Settings" };
function detectLang() {
  const l = (navigator.language || "en").toLowerCase();
  if (/^zh-(tw|hk|mo|hant)/.test(l)) return "Traditional Chinese";
  if (l.startsWith("zh")) return "Simplified Chinese";
  if (l.startsWith("ja")) return "Japanese";
  return "English";
}
const S = {
  filter: [], feeds: null, own: [], whole: null, fetched: false,
  stances: {}, sIdx: 0, issued: false, done: false,
  hours: [8, 18], lang: detectLang(),
  tz: Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC", discord: "", email: "",
};
function ensure(step) {
  const i = STEPS.indexOf(step);
  if (i > 1 && S.feeds === null) S.feeds = ["報導者", "公視新聞網", "關鍵評論網", "iThome", "Stratechery", "數位時代"];
  if (i > 2 && S.whole === null) S.whole = { "報導者": true, "Stratechery": true };
  if (i > 3) S.fetched = true;
  if (i > 5) S.issued = true;
}
const pickedFeeds = () => [...(S.feeds || []), ...S.own];
const isWhole = f => !!(S.whole && S.whole[f] === true);
const wholeFeeds = () => pickedFeeds().filter(isWhole);
function stanceTopics() {
  const ids = [...new Set(pickedFeeds().map(topicOf))];
  if (!ids.length) ids.push("taiwan", "tech");
  const out = [];
  for (let r = 0; out.length < 6 && r < 3; r++) for (const id of ids) if (out.length < 6) out.push(STANCE_POOL[id][r]);
  for (const t of TOPICS) for (const s of STANCE_POOL[t.id]) if (out.length < 6 && !out.includes(s)) out.push(s);
  return out;

/* ---- voices: each feed says a few headlines into the room, keyed so a voice is the same voice on every step ---- */
function feedVoices(f) {
  const n = feedRec(f)?.voices ?? 2, pool = STANCE_POOL[topicOf(f)], h = hash(f), out = [];
  for (let k = 0; k < n; k++) {
    const topic = pool[(h + k) % 3], lines = LINES[topic];
    out.push({ key: f + "#" + k, feed: f, topic, text: lines[(h + Math.floor(k / 3)) % lines.length] });
  }
  return out;
}
const firstVoice = f => feedVoices(f)[0];
const allVoices = () => pickedFeeds().flatMap(feedVoices);
/* topics with no voice among the picked feeds still get two, so a stance always has lines to move */
function fillerVoices(topics, have) {
  const seen = new Set(have.map(v => v.topic));
  return topics.filter(t => !seen.has(t)).flatMap(t => LINES[t].map((text, k) => ({ key: "x:" + t + k, feed: "", topic: t, text })));
}
/* the editor's own pick of what speaks first, before the reader has said anything */
function editorPicks(skip) {
  const st = t => S.stances[t];
  return pickedFeeds().filter(f => !skip.has(f)).map(firstVoice)
    .filter(v => st(v.topic) !== "less")
    .sort((a, b) => (st(b.topic) === "more") - (st(a.topic) === "more")).slice(0, 2);
}

/* ---- the issue the answers make ---- */
function issueParts() {
  const feeds = pickedFeeds(), st = t => S.stances[t];
  const deep = wholeFeeds().map(f => ({ feed: f, title: firstVoice(f).text, key: firstVoice(f).key }));
  const stories = [], frags = [];
  for (const c of [...new Set(feeds.map(topicOf))]) {
    const skim = feeds.filter(f => topicOf(f) === c && !isWhole(f));
    if (!skim.length) continue;
    const pool = STANCE_POOL[c].filter(t => st(t) !== "less").sort((a, b) => (st(b) === "more") - (st(a) === "more"));
    const voices = skim.flatMap(feedVoices);
    if (skim.length >= 2 && pool.length) {
      const topic = pool[0];
      let members = voices.filter(v => v.topic === topic);
      if (members.length < 2) members = skim.map(firstVoice);
      stories.push({ topic, cat: c, more: st(topic) === "more", sources: skim, members });
      const rest = voices.find(v => !members.includes(v) && st(v.topic) !== "less");
      if (rest) frags.push({ title: rest.text, feed: rest.feed, key: rest.key });
    } else skim.forEach(f => { const v = feedVoices(f).find(x => st(x.topic) !== "less"); if (v) frags.push({ title: v.text, feed: f, key: v.key }); });
  }
  return { deep, stories, frags };
}

const pad = h => String(h).padStart(2, "0") + ":00";
let timers = [];
function later(fn, ms) { const t = setTimeout(fn, RM.matches ? 0 : ms); timers.push(t); return t; }
function clearTimers() { timers.forEach(clearTimeout); timers = []; }

/* ---- a sentence that assembles word by word; nodes in it are single words ---- */
function sentence(parts, cls) {
  const el = document.createElement("p");
  el.className = "say" + (cls ? " " + cls : "");
  let n = 0;
  const word = node => { const w = document.createElement("span"); w.className = "w"; w.style.animationDelay = (n++ * 45) + "ms"; w.append(node); el.append(w); };
  for (const part of parts) {
    if (typeof part === "string") part.split(/(\s+)/).forEach(tok => { if (!tok) return; if (/^\s+$/.test(tok)) el.append(" "); else word(document.createTextNode(tok)); });
    else word(part);
  }
  el.assembledIn = RM.matches || (cls || "").includes("still") ? 0 : n * 45 + 520;
  return el;
}
/* the room holds near still while a sentence assembles */
function speak(stage, s) { stage.append(s); ROOM.calm(s.assembledIn); return s; }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function blankBtn(text, pressed, onTap) {
  const b = el("button", "blank", text); b.type = "button";
  if (pressed !== null) b.setAttribute("aria-pressed", String(!!pressed));
  b.addEventListener("click", () => onTap(b)); return b;
}
function btn(text, kind, onTap) { const b = el("button", "btn " + kind, text); b.type = "button"; b.addEventListener("click", onTap); return b; }
function hint(text, cls) { return el("p", "hint" + (cls ? " " + cls : ""), text); }
function span(t) { const s = el("span", "", t); if (!isLatin(t)) s.lang = ""; return s; }
function sayBtn(t, pressed, fn) { const b = blankBtn(t, pressed, fn); b.classList.add("say", "dense"); return b; }
const lock = stage => stage.querySelectorAll("button, input, select").forEach(b => b.disabled = true);
function nav(step, primary, back, cls) {
  const n = el("div", "nav" + (cls ? " " + cls : ""));
  const i = STEPS.indexOf(step);
  if (i > 0) n.append(btn("Back", "secondary", back || (() => go(STEPS[i - 1], false))));
  if (step !== "settings") n.append(btn("Skip", "secondary", () => skip(step)));
  n.append(el("span", "grow"));
  if (primary) n.append(primary);
  return n;
}
/* the room block: the canvas plus one sentence that says in words what the canvas shows */
function roomBlock(size, sticky) {
  const box = el("div", "room " + size + (sticky ? " sticky" : ""));
  const desc = el("p", "sr");
  box.append(ROOM.canvas, desc);
  return { box, describe: t => desc.textContent = t };
}

/* ---- moving between steps ---- */
function go(step, fwd) {
  clearTimers();
  const stage = document.getElementById("stage");
  if (fwd && !RM.matches) { stage.classList.add("leaving"); setTimeout(() => setHash(step), 260); }
  else setHash(step);
}
function setHash(step) { if (location.hash === "#" + step) render(); else location.hash = step; }
function next(step) { go(STEPS[STEPS.indexOf(step) + 1], true); }
function skip(step) {
  if (step === "feeds" && S.feeds === null) S.feeds = [];
  if (step === "lanes" && S.whole === null) S.whole = {};
  if (step === "fetch") S.fetched = true;
  if (step === "stances") S.sIdx = 0;
  if (step === "issue") S.issued = true;
  next(step);
}

/* the usual room after the reader has answered: whole feeds and the editor's picks in front,
   topics asked for more raised out of the murmur, topics asked for less faded under it */
function roomSpecs(opts = {}) {
  const st = t => S.stances[t];
  const whole = new Set(wholeFeeds());
  const front = [...whole].map(f => ({ ...firstVoice(f), tier: "front", label: f, mark: true }));
  const picks = opts.noPicks ? [] : editorPicks(whole).map(v => ({ ...v, tier: "front", label: v.feed }));
  const frontKeys = new Set([...front, ...picks].map(v => v.key));
  let voices = allVoices();
  if (opts.fillTopics) voices = voices.concat(fillerVoices(opts.fillTopics, voices));
  const raisedCount = {};
  const rest = voices.filter(v => !frontKeys.has(v.key)).map(v => {
    const s = st(v.topic);
    if (s === "more" && (raisedCount[v.topic] = (raisedCount[v.topic] || 0) + 1) <= 2) return { ...v, tier: "raised" };
    if (s === "less") return { ...v, tier: "gone" };
    return { ...v, tier: "murmur", hi: v.topic === opts.hi };
  });
  return [...front, ...picks, ...rest];
}

  lanes(stage) {

  if (!stories.length) storyL.append(el("p", "empty", "None this time: no two skimmed sources talked about one thing."));
  stories.forEach(s => {

    const p = el("p", "", lang === "en" ? "Several outlets on one development, told once." : "幾個來源報導同一進展，合成一段話告訴你。"); p.lang = lang;

}

/* ================= the room: one canvas of voices ================= */
/* a small seeded generator, so a voice keeps its place in the room across steps */

const ROOM = createRoom();

function render() {
  clearTimers();
  let step = location.hash.slice(1);

window.addEventListener("hashchange", render);
render();
</script>
