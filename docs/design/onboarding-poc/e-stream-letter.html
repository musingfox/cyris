<style>
:root {
  /* backgrounds, deepest to lightest */
  --bg: #07070a;
  --bg-elev: #0d0d12;
  --surface: #11111a;
  --surface-2: #161622;
  /* lines */
  --border: #1f1f2e;
  --border-strong: #2a2a40;
  /* text */

  --text-dim: #8a8aa0;
  --text-faint: #62627a;
  /* semantic */
  --accent: #c6ff3d;
  --accent-dim: #8aa829;
  --warn: #ff5b8a;
  --accent-tint: rgba(198, 255, 61, 0.07);
  --warn-tint: rgba(255, 91, 138, 0.12);
  --grid: rgba(198, 255, 61, 0.035);
  /* spacing */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px;  --s-4: 16px;  --s-5: 20px;
  --s-6: 24px; --s-8: 32px; --s-12: 48px; --s-16: 64px; --s-20: 80px;
  /* fonts and the type scale multiplier */
  --font-sans: 'Geist', system-ui, -apple-system, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, monospace;
  --font-serif: 'Instrument Serif', Georgia, serif;
  --type-scale: 1;
  /* shape, motion, layout */
  --r-control: 6px;
  --r-tag: 999px;
  --t-fast: 150ms ease-out;
  --bar-h: 60px;
  --measure: 640px;
  --measure-wide: 760px;
}
/* POC only: the typographic and scene motion needs durations the spec has no token for. */
:root { --t-word: 520ms; --t-leave: 260ms; --t-arrive: 420ms; --t-scene: 600ms; --scrim-h: 60vh; }

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

/* the stage: a full-screen scene; the sentence sits over it behind a --bg scrim */
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; transition: opacity var(--t-scene) ease-out; }
.scrim { position: fixed; left: 0; right: 0; top: 0; height: var(--scrim-h); pointer-events: none;
  background: linear-gradient(to bottom, color-mix(in srgb, var(--bg) 94%, transparent) 0%,
    color-mix(in srgb, var(--bg) 86%, transparent) 72%, transparent 100%);
  transition: opacity var(--t-scene) ease-out; }
.strata-labels span { position: fixed; left: 0; top: 0; pointer-events: none; white-space: nowrap;
  transition: opacity var(--t-scene) ease-out; }
.strata-labels b { font-weight: 500; color: var(--text); }
body.text-only #scene, body.text-only .scrim, body.text-only .strata-labels { display: none; }
body.revealed #scene, body.revealed .scrim, body.revealed .strata-labels { opacity: 0; }

.page { position: relative; max-width: var(--measure); margin: 0 auto; padding: var(--s-5) var(--s-4) var(--s-16); min-height: 100vh; }
@media (min-width: 720px) { .page { padding: var(--s-8) var(--s-6) var(--s-20); } }
body.revealed .page { max-width: var(--measure-wide); }

.top { display: flex; justify-content: space-between; align-items: center; height: var(--s-8); }
.brand { display: flex; align-items: center; gap: var(--s-2); font-family: var(--font-mono); font-weight: 500;
  font-size: calc(12px * var(--type-scale)); letter-spacing: .1em; text-transform: uppercase; color: var(--text); }
.brand i { width: 12px; height: 12px; background: var(--accent); box-shadow: 0 0 12px rgba(198,255,61,.45); }
.label { font-family: var(--font-mono); font-weight: 500; font-size: calc(12px * var(--type-scale));
  letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); }

/* the letter: answers condensed into lines, receding above the sentence */
.letter { font-family: var(--font-serif); font-size: calc(19px * var(--type-scale)); line-height: 1.45;
  color: var(--text-dim); margin: var(--s-8) 0 var(--s-6); min-height: var(--s-6); }
.letter p { margin: 0; }
.letter p.salute { font-style: italic; }
.letter p.sign { font-style: italic; color: var(--text); margin-top: var(--s-2); }
.letter.capped { max-height: calc(19px * 1.45 * 2 * var(--type-scale)); overflow: hidden;
  display: flex; flex-direction: column; justify-content: flex-end;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 60%);
  mask-image: linear-gradient(to bottom, transparent, #000 60%); }
.letter .arrive { animation: arrive var(--t-arrive) ease-out both; }
.letter [lang] { font-style: normal; }
body.revealed .letter { display: none; }
@keyframes arrive { from { opacity: 0; transform: translateY(var(--s-3)); } to { opacity: 1; transform: none; } }

.stage { transition: opacity var(--t-leave) ease-in, transform var(--t-leave) ease-in; }
.stage.leaving { opacity: 0; transform: translateY(calc(-1 * var(--s-8))) scale(.96); transform-origin: top left; }

.say { font-family: var(--font-serif); font-weight: 400; font-size: calc(clamp(32px, 5.6vw, 52px) * var(--type-scale));
  line-height: 1.14; letter-spacing: -0.02em; margin: 0; overflow-wrap: anywhere; text-align: center; }
.say.dense { font-size: calc(clamp(24px, 3.9vw, 34px) * var(--type-scale)); line-height: 1.35; letter-spacing: -0.01em; }
.say em { font-style: italic; color: var(--accent); }
.say em[lang] { font-style: normal; }
.w { display: inline-block; animation: assemble var(--t-word) ease-out both; }
.say.still .w { animation: fade var(--t-arrive) ease-out both; animation-delay: 0s !important; }
@keyframes assemble { from { opacity: 0; transform: translateY(.35em); } to { opacity: 1; transform: none; } }
.count { font-variant-numeric: tabular-nums; color: var(--accent); font-style: italic; }

/* a blank: a word in the sentence the reader taps or types */
.blank { font: inherit; letter-spacing: inherit; color: var(--text-dim); background: none; border: 0;
  border-bottom: 1px solid var(--border-strong); padding: 2px .06em; margin: 0; cursor: pointer;
  transition: color var(--t-fast), border-color var(--t-fast), opacity var(--t-fast); }
.blank:hover { color: var(--text); }
.blank.say { font-family: var(--font-serif); }
.blank:active { opacity: .7; }
.blank:disabled { cursor: default; }
.blank[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); }
input.blank, select.blank { cursor: text; color: var(--accent); border-bottom-color: var(--accent-dim); border-radius: 0;
  -webkit-appearance: none; appearance: none; text-align: center; }
input.blank:focus, select.blank:focus { outline: none; border-bottom-color: var(--accent); }
input.blank::placeholder { color: var(--text-dim); font-style: italic; }
input.blank.hour { width: 1.6em; -moz-appearance: textfield; }
input.blank.hour::-webkit-inner-spin-button, input.blank.hour::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input.blank.wide { width: min(100%, 9em); }
input.blank[aria-invalid="true"] { border-bottom-color: var(--warn); }
select.blank { cursor: pointer; background: none; padding-right: .1em; max-width: 100%; }
select.blank option { font-family: var(--font-sans); font-size: 16px; background: var(--bg-elev); color: var(--text); }

.quiet { display: flex; gap: var(--s-8); margin-top: var(--s-6); flex-wrap: wrap; justify-content: center; }
.hint { font-size: calc(14px * var(--type-scale)); line-height: 1.5; color: var(--text-dim); margin: var(--s-4) auto 0; text-align: center; max-width: 34em; }
.hint.warn { color: var(--warn); }
.shortcut { font: inherit; color: var(--text-dim); background: none; border: 0; border-bottom: 1px solid var(--border-strong);
  padding: 0; cursor: pointer; font-family: var(--font-serif); font-style: italic; font-size: calc(19px * var(--type-scale)); }
.shortcut:hover { color: var(--text); }
.shortcut-row { text-align: center; margin: var(--s-5) 0 0; }

.nav { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-3); margin-top: var(--s-8); }
.nav .grow { flex: 1; }
.btn { height: 44px; padding: 0 var(--s-5); font-family: var(--font-mono); font-weight: 500; font-size: calc(12px * var(--type-scale));
  text-transform: uppercase; letter-spacing: .1em; border-radius: var(--r-control); border: 1px solid transparent; cursor: pointer;
  transition: background-color var(--t-fast), color var(--t-fast), border-color var(--t-fast), opacity var(--t-fast); }
.btn.primary { background: var(--accent); color: var(--bg); }
.btn.primary:hover { background: #d4ff66; }
.btn.secondary { background: var(--surface-2); border-color: var(--border-strong); color: var(--text-dim); }
.btn.secondary:hover { color: var(--text); }
.btn:active { opacity: .7; }
.btn:disabled { opacity: .4; cursor: default; }

/* the first issue: the whole screen, three labelled layers */
.issue { margin-top: var(--s-8); }
.issue.appear { animation: fade var(--t-scene) ease-out both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.issue-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-4); flex-wrap: wrap;
  border-bottom: 1px solid var(--border); padding-bottom: var(--s-4); margin-bottom: var(--s-6); }
.issue-title { font-family: var(--font-serif); font-weight: 400; font-size: calc(clamp(56px, 8.75vw, 119px) * var(--type-scale)); line-height: .92; letter-spacing: -0.04em; margin: 0; }
.data { font-family: var(--font-mono); font-size: calc(14px * var(--type-scale)); font-variant-numeric: tabular-nums; color: var(--text-dim); }
.layer { margin-top: var(--s-12); }
.layer-head { margin: 0 0 var(--s-4); }
.marker { display: flex; align-items: center; gap: var(--s-3); margin: 0 0 var(--s-2); }
.marker::before { content: ""; width: 24px; height: 1px; background: var(--accent); }
.layer-head p { margin: 0; font-size: calc(14px * var(--type-scale)); line-height: 1.5; color: var(--text-dim); }
.item { background: var(--bg-elev); border: 1px solid var(--border); padding: var(--s-4) var(--s-5); display: grid; gap: var(--s-1); }
.item + .item { border-top: 0; }
.item h3 { font-size: calc(18px * var(--type-scale)); font-weight: 600; line-height: 1.3; margin: 0; }
.item.pebble h3 { font-size: calc(19px * var(--type-scale)); }
.item p { margin: 0; font-size: calc(14px * var(--type-scale)); line-height: 1.5; color: var(--text-dim); }
.item .more { color: var(--accent); }
.water { border: 1px solid var(--border); background: var(--bg-elev); }
.water div { display: flex; justify-content: space-between; gap: var(--s-4); padding: var(--s-3) var(--s-5); border-bottom: 1px solid var(--border);
  font-size: calc(14px * var(--type-scale)); line-height: 1.5; }
.water div:last-child { border-bottom: 0; }
.water .label { flex: none; }
.empty { font-size: calc(14px * var(--type-scale)); color: var(--text-dim); margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="scrim" aria-hidden="true"></div>
<div class="strata-labels" aria-hidden="true">
  <span class="label" data-tray="pebble"><b>Pebble</b> · read whole</span>
  <span class="label" data-tray="sand"><b>Sand</b> · many on one topic, a line</span>
  <span class="label" data-tray="water"><b>Water</b> · one line each</span>
</div>
<main class="page">
  <div class="top"><span class="brand"><i aria-hidden="true"></i>Cyris</span><span class="label" id="progress"></span></div>
  <div class="letter" id="letter" aria-label="The letter so far"></div>
  <div class="stage" id="stage" aria-live="polite"></div>
</main>
<script type="module">
const RM = window.matchMedia("(prefers-reduced-motion: reduce)");

/* ---- fake data: names and topics from src/cyris/onboarding_feeds.json ---- */
const TOPICS = [
  { id: "tech", label: "Technology" },
  { id: "business", label: "Business & economy" },
  { id: "world", label: "World" },
  { id: "taiwan", label: "Taiwan" },
  { id: "science", label: "Science & health" },
  { id: "ideas", label: "Ideas & culture" },
];
const FEEDS = {
  tech: ["iThome", "科技新報", "數位時代", "Hacker News", "Stratechery", "Simon Willison's Weblog"],
  business: ["經濟日報", "The Economist", "Financial Times", "市場先生", "Noahpinion"],
  world: ["BBC中文網 繁體", "端傳媒", "The Guardian", "NPR", "The Diplomat"],
  taiwan: ["報導者", "中央社即時新聞 政治新聞", "公視新聞網", "自由時報", "關鍵評論網", "台灣事實查核中心"],
  science: ["泛科學 PanSci", "CASE 報科學", "Quanta Magazine", "Nautilus", "Terence Tao"],
  ideas: ["換日線", "Aeon", "The Marginalian", "The Atlantic Ideas", "Literary Hub"],
};
const STANCE_POOL = {
  tech: ["台積電美國廠", "AI 代理", "開源授權"],
  business: ["美國關稅", "央行利率", "輝達財報"],
  world: ["烏克蘭停火談判", "美中晶片管制", "加薩人道走廊"],
  taiwan: ["總預算審查", "罷免投票", "健保費率調整"],
  science: ["登革熱疫情", "減重藥物", "韋伯望遠鏡"],
  ideas: ["獨立書店", "長照人力", "AI 與著作權"],
};
const TITLES = {
  tech: ["企業導入 AI 代理的第一年：權限管理成最大瓶頸", "亞利桑那二廠提前量產，良率仍落後台南", "開源授權改版爭議：社群為何出走"],
  business: ["關稅上路三個月：台灣出口商怎麼調整供應鏈", "央行按兵不動，房市信用管制再收緊", "輝達財報優於預期，伺服器供應鏈訂單看到明年"],
  world: ["停火談判第二輪：雙方在哪些條件上仍有分歧", "美中晶片管制再升級，東南亞封測廠受惠", "人道走廊重開，聯合國物資車隊進入北部"],
  taiwan: ["山區部落的最後一哩路：偏鄉醫療的十年", "總預算審查卡關，地方建設經費延宕", "健保費率調整案：誰多付、誰少付"],
  science: ["登革熱南部疫情升溫，專家：社區孳生源是關鍵", "減重藥物的長期數據：停藥後會怎樣", "韋伯望遠鏡看見最早的星系團"],
  ideas: ["獨立書店的第三種活法", "長照人力缺口：移工之外還有什麼路", "生成式 AI 與著作權：法院怎麼看"],
};
const LANGS = ["Traditional Chinese", "Simplified Chinese", "English", "Japanese"];
const LANG_TAG = { "Traditional Chinese": "zh-Hant", "Simplified Chinese": "zh-Hans", English: "en", Japanese: "ja" };

function hash(s) { let h = 7; for (const c of s) h = (h * 31 + c.codePointAt(0)) % 9973; return h; }
function newCount(name) { return 3 + hash(name) % 14; }
function topicOf(name) { return TOPICS.find(t => FEEDS[t.id].includes(name))?.id || "tech"; }
function stanceCat(t) { return TOPICS.find(x => STANCE_POOL[x.id].includes(t))?.id || "tech"; }
function isLatin(s) { return /^[\x00-\x7f’]+$/.test(s); }

/* ---- state; a step opened by hash fills in what the steps before it would have ---- */
const STEPS = ["opening", "topics", "feeds", "lanes", "fetch", "stances", "issue", "settings"];
const PROGRESS = { opening: 1, topics: 2, feeds: 2, lanes: 3, fetch: 4, stances: 5, issue: 6, settings: 7 };
function detectLang() {
  const l = (navigator.language || "en").toLowerCase();
  if (/^zh-(tw|hk|mo|hant)/.test(l)) return "Traditional Chinese";
  if (l.startsWith("zh")) return "Simplified Chinese";
  if (l.startsWith("ja")) return "Japanese";
  return "English";
}
const S = {
  topics: null, feeds: null, own: [], whole: null, lIdx: 0, fetched: false,
  stances: {}, sIdx: 0, issued: false, done: false,
  hours: [8, 18], lang: detectLang(),
  tz: Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC", discord: "", email: "",
};
function ensure(step) {
  const i = STEPS.indexOf(step);
  if (i > 1 && S.topics === null) S.topics = ["taiwan", "tech"];
  if (i > 2 && S.feeds === null) S.feeds = ["報導者", "公視新聞網", "關鍵評論網", "iThome", "Stratechery", "數位時代"];
  if (i > 3 && S.whole === null) S.whole = { "報導者": true, "Stratechery": true };
  if (i > 4) S.fetched = true;
  if (i > 6) S.issued = true;
}
const chosenTopics = () => S.topics || [];
const pickedFeeds = () => [...(S.feeds || []), ...S.own];
const isWhole = f => !!(S.whole && S.whole[f] === true);
const wholeFeeds = () => pickedFeeds().filter(isWhole);
/* unanswered means skim; a skimmed feed is sand when another skimmed feed shares its topic, else water */
function skimShape(f) {
  const c = topicOf(f);
  return pickedFeeds().filter(g => topicOf(g) === c && !isWhole(g)).length >= 2 ? "sand" : "water";
}
function stanceTopics() {
  const ids = chosenTopics().length ? chosenTopics() : ["taiwan", "tech"];
  const out = [];
  for (let r = 0; out.length < 6 && r < 3; r++) for (const id of ids) if (out.length < 6) out.push(STANCE_POOL[id][r]);
  for (const t of TOPICS) for (const s of STANCE_POOL[t.id]) if (out.length < 6 && !out.includes(s)) out.push(s);
  return out;
}

/* ---- the issue the answers make: the same rule the scene's strata follow ---- */
function issueParts() {
  const feeds = pickedFeeds(), st = t => S.stances[t];
  const whole = wholeFeeds().map((f, k) => ({ feed: f, title: TITLES[topicOf(f)][(hash(f) + k) % 3] }));
  const sand = [], water = [];
  for (const c of [...new Set(feeds.map(topicOf))]) {
    const skim = feeds.filter(f => topicOf(f) === c && !isWhole(f));
    if (!skim.length) continue;
    const pool = STANCE_POOL[c].filter(t => st(t) !== "less").sort((a, b) => (st(b) === "more") - (st(a) === "more"));
    if (skim.length >= 2 && pool.length) {
      const more = st(pool[0]) === "more";
      sand.push({ topic: pool[0], cat: c, more, count: Math.min(skim.length + 1 + (more ? 2 : 0), 6), sources: skim });
      water.push({ key: "w:" + c, title: TITLES[c][(hash(c) + 1) % 3], feed: skim[skim.length - 1] });
    } else skim.forEach((f, k) => water.push({ key: "f:" + f, title: TITLES[c][(hash(f) + k + 1) % 3], feed: f }));
  }
  const inCount = feeds.reduce((n, f) => n + newCount(f), 0);
  const kept = whole.length + sand.reduce((n, s) => n + s.count, 0) + water.length;
  return { whole, sand, water, inCount: Math.max(inCount, kept), kept };
}

/* ---- what the strata hold at a step: the scene renders this, the issue lists it ---- */
function strataFor(step) {
  const m = { stones: [], piles: {}, dashes: [] };
  const i = STEPS.indexOf(step);
  if (i < 3) return m;
  const feeds = pickedFeeds();
  const answered = i > 3 ? feeds : feeds.filter(f => S.whole && f in S.whole);
  for (const f of answered) {
    if (isWhole(f)) m.stones.push({ key: "f:" + f, tray: "pebble", src: f, size: 0.24 + (hash(f) % 5) * 0.015 });
    else if (skimShape(f) === "sand") { const c = topicOf(f); m.piles[c] = (m.piles[c] || 0) + 3; m.src = m.src || {}; (m.src[c] ||= []).push(f); }
    else m.dashes.push({ key: "f:" + f, src: f });
  }
  if (i >= 5) for (const t of stanceTopics()) {
    const v = S.stances[t];
    m.stones.push({ key: "t:" + t, topic: true, cat: stanceCat(t), size: 0.17,
      tray: v === "more" ? "pebble" : v === "less" ? "water" : "sand", accent: v === "more" });
  }
  if (i >= 6 && (S.issued || step === "settings")) addIssue(m);
  return m;
}
function addIssue(m) {
  const p = issueParts();
  for (const s of p.sand) { m.piles[s.cat] = (m.piles[s.cat] || 0) + s.count; (m.src ||= {})[s.cat] = s.sources; }
  for (const w of p.water) if (!m.dashes.some(d => d.key === w.key)) m.dashes.push({ key: w.key, src: w.feed });
  return p;
}

/* ---- the letter: each answered step condensed to one line ---- */
function list(xs, max) {
  const shown = xs.slice(0, max), rest = xs.length - shown.length;
  if (rest > 0) return shown.join(", ") + " and " + rest + " more";
  return shown.length > 1 ? shown.slice(0, -1).join(", ") + " and " + shown[shown.length - 1] : shown[0] || "";
}
function lineFor(step) {
  switch (step) {
    case "opening": return "Ninety in, a dozen out.";
    case "topics": return chosenTopics().length ? "You follow " + list(chosenTopics().map(id => TOPICS.find(t => t.id === id).label), 3) + "." : "No topics yet; you'll bring your own feeds.";
    case "feeds": return pickedFeeds().length ? "I’ll watch " + list(pickedFeeds(), 3) + " for you." : "No feeds yet.";

/* ---- a sentence that assembles word by word; nodes in it are single words ---- */

  }

  /* the camera: high above the mesh, or down at the strata */
  const POSE = {
    top: () => ({ pos: [0, 1.6, fitZ(12.5)], look: [0, 0.55, 0] }),
    strata: () => ({ pos: [0, 0.5, fitZ(7.4)], look: [0, -1.25, 0] }),
  };
  const fitZ = z => { const w = 2 * z * Math.tan(THREE.MathUtils.degToRad(21)) * aspect; return w < SPAN * 1.12 ? (SPAN * 1.12) / (2 * Math.tan(THREE.MathUtils.degToRad(21)) * aspect) : z; };
  let cam = { name: "top", from: null, t0: 0, dur: 0, res: null };
  const lookV = new THREE.Vector3();
  function applyCamera() {
    const to = POSE[cam.name]();
    let pos = to.pos, look = to.look;
    if (cam.from) {
      const t = Math.min(1, (performance.now() - cam.t0) / cam.dur), e = ease(t);
      pos = pos.map((v, i) => cam.from.pos[i] + (v - cam.from.pos[i]) * e);
      look = look.map((v, i) => cam.from.look[i] + (v - cam.from.look[i]) * e);
      if (t >= 1) { cam.from = null; const r = cam.res; cam.res = null; r && r(); }
    }
    const sway = RM.matches ? 0 : Math.sin(performance.now() / 9000) * 0.12;
    camera.position.set(pos[0] + sway, pos[1], pos[2]);
    camera.lookAt(lookV.set(look[0], look[1], look[2]));
  }
  function pose(name, animate) {
    if (cam.name === name && !cam.from) return Promise.resolve();
    if (!animate || RM.matches) { cam = { name, from: null }; applyCamera(); if (!running) draw(); return Promise.resolve(); }
    const cur = { pos: camera.position.toArray(), look: POSE[cam.name]().look };
    cam = { name, from: cur, t0: performance.now(), dur: 2600, res: null };
    return new Promise(r => cam.res = r);
  }

  /* the strata's names, pinned beside each tray */
  const labels = [...document.querySelectorAll(".strata-labels span")];
  let textBottom = 0;
  function placeLabels() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    for (const el of labels) {
      V.set(-SPAN / 2, Y[el.dataset.tray], HALF_D).project(camera);
      const x = Math.max(16, (V.x + 1) / 2 * w), y = (1 - V.y) / 2 * h + 6;
      el.style.transform = `translate(${x}px, ${y}px)`;
      el.style.opacity = y < textBottom ? "0" : "";
    }
  }

  function resize() {
    const w = innerWidth, h = innerHeight; aspect = w / h;
    renderer.setSize(w, h, false); camera.aspect = aspect; camera.updateProjectionMatrix();
    const vis = 2 * 12.5 * Math.tan(THREE.MathUtils.degToRad(21)) * aspect;
    SPAN = Math.max(3.4, Math.min(9, vis * 0.84));
    unit.children.forEach(o => { o.scale.x = SPAN; });
    applyCamera(); if (!running) draw();
  }

  let last = 0;
  function frame(now) {
    const raw = Math.min(0.1, (now - (last || now)) / 1000); last = now;
    if (now < calmUntil) paceTo = 0.06; else paceTo = 1;
    pace += (paceTo - pace) * Math.min(1, raw * (paceTo > pace ? 2.6 : 6));
    step(raw * pace);
    applyCamera(); draw();
  }
  function setLoop() {
    const on = !RM.matches && !covered && !document.hidden;
    if (on === running) return;
    running = on; last = 0;
    renderer.setAnimationLoop(on ? frame : null);
    if (!on) draw();
  }
  document.addEventListener("visibilitychange", setLoop);
  addEventListener("resize", resize);
  RM.addEventListener?.("change", setLoop);
  resize(); setLoop();

  return {
    sync, gather, clearGather, pose,
    setEmitters(list) { emitters = list.map(e => ({ ...(emitters.find(o => o.key === e.key) || {}), ...e })); },
    calm(ms) { if (ms > 0) calmUntil = performance.now() + ms; },
    focus(key) { focusKey = key; if (!running) draw(); },
    cover(on) { covered = on; setLoop(); },
    textBottom(px) { textBottom = px; if (!running) draw(); },
    elapsed: () => (performance.now() - enteredAt),
    mark() { enteredAt = performance.now(); },
  };
}
let enteredAt = performance.now();

/* WebGL or not: without it, the letter is the whole experience */
let SC = null;
try {
  if (!document.createElement("canvas").getContext("webgl2")) throw new Error("no WebGL 2");
  const THREE = await import("three");
  SC = createScene(THREE, document.getElementById("scene"));
} catch (e) {
  SC = null;
}
document.body.classList.toggle("text-only", !SC);

/* the scrim follows the sentence, so text stays readable over the stream */
const stageEl = document.getElementById("stage");
new ResizeObserver(() => {
  const b = stageEl.getBoundingClientRect().bottom;
  document.documentElement.style.setProperty("--scrim-h", Math.min(innerHeight * 0.9, b + 48) + "px");
  SC?.textBottom(b + 8);
}).observe(stageEl);

let seq = 0;
async function render() {
  const my = ++seq;
  clearTimers();
  let step = location.hash.slice(1);
  if (!STEPS.includes(step)) step = "opening";
  ensure(step);
  const fwd = forward; forward = false;
  document.getElementById("progress").textContent = PROGRESS[step] + " of 7";
  document.body.classList.remove("revealed");
  renderLetter(step);
  const stage = document.getElementById("stage");
  stage.classList.remove("leaving"); stage.textContent = "";
  if (SC) {
    SC.mark(); SC.cover(false);
    SC.pose("top", false);
    SC.setEmitters(emittersFor(step));
    if (step !== "fetch") SC.clearGather(!fwd);
    if (step !== "opening" && step !== "issue") {
      const m = strataFor(step);
      if (step === "fetch" && S.fetched) SC.gather([], false);
      await SC.sync(m, { animate: fwd && !RM.matches });
      if (my !== seq) return;
    } else if (step === "issue") SC.sync(strataFor("stances"), { animate: false });
  }
  VIEW[step](stage);
}
window.addEventListener("hashchange", () => render());
render();
</script>
</body>
</html>
