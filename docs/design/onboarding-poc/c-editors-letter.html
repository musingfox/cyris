<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor's letter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root {
  /* backgrounds, deepest to lightest */
  --bg: #07070a;
  --bg-elev: #0d0d12;
  --surface: #11111a;
  --surface-2: #161622;
  /* lines */
  --border: #1f1f2e;
  --border-strong: #2a2a40;
  /* text */
  --text: #ebebf2;
  --text-dim: #8a8aa0;
  --text-faint: #62627a;
  /* semantic */
  --accent: #c6ff3d;
  --accent-dim: #8aa829;
  --warn: #ff5b8a;
  --accent-tint: rgba(198, 255, 61, 0.07);
  --warn-tint: rgba(255, 91, 138, 0.12);
  --grid: rgba(198, 255, 61, 0.035);
  /* spacing */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px;  --s-4: 16px;  --s-5: 20px;
  --s-6: 24px; --s-8: 32px; --s-12: 48px; --s-16: 64px; --s-20: 80px;
  /* fonts and the type scale multiplier */
  --font-sans: 'Geist', system-ui, -apple-system, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, monospace;
  --font-serif: 'Instrument Serif', Georgia, serif;
  --type-scale: 1;
  /* shape, motion, layout */
  --r-control: 6px;
  --r-tag: 999px;
  --t-fast: 150ms ease-out;
  --bar-h: 60px;
  --measure: 640px;
  --measure-wide: 760px;
}
/* POC only: the typographic motion needs durations the spec has no token for. */
:root { --t-word: 520ms; --t-leave: 260ms; --t-arrive: 420ms; }

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

.page { max-width: var(--measure); margin: 0 auto; padding: var(--s-5) var(--s-4) var(--s-16); min-height: 100vh; }
@media (min-width: 720px) { .page { padding: var(--s-8) var(--s-6) var(--s-20); } }

.top { display: flex; justify-content: space-between; align-items: center; height: var(--s-8); }
.brand { display: flex; align-items: center; gap: var(--s-2); font-family: var(--font-mono); font-weight: 500;
  font-size: calc(12px * var(--type-scale)); letter-spacing: .1em; text-transform: uppercase; color: var(--text); }
.brand i { width: 12px; height: 12px; background: var(--accent); box-shadow: 0 0 12px rgba(198,255,61,.45); }
.label { font-family: var(--font-mono); font-weight: 500; font-size: calc(12px * var(--type-scale));
  letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); }

/* the letter: answers condensed into lines, receding above the sentence */
.letter { font-family: var(--font-serif); font-size: calc(19px * var(--type-scale)); line-height: 1.45;
  color: var(--text-dim); margin: var(--s-12) 0 var(--s-8); min-height: var(--s-6); }
.letter p { margin: 0; }
.letter p.salute { font-style: italic; }
.letter p.sign { font-style: italic; color: var(--text); margin-top: var(--s-2); }
.letter.capped { max-height: calc(19px * 1.45 * 4 * var(--type-scale)); overflow: hidden;
  display: flex; flex-direction: column; justify-content: flex-end;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 60%);
  mask-image: linear-gradient(to bottom, transparent, #000 60%); }
.letter .arrive { animation: arrive var(--t-arrive) ease-out both; }
.letter [lang] { font-style: normal; }
@keyframes arrive { from { opacity: 0; transform: translateY(var(--s-3)); } to { opacity: 1; transform: none; } }

.stage { transition: opacity var(--t-leave) ease-in, transform var(--t-leave) ease-in; }
.stage.leaving { opacity: 0; transform: translateY(calc(-1 * var(--s-8))) scale(.96); transform-origin: top left; }

.say { font-family: var(--font-serif); font-weight: 400; font-size: calc(clamp(32px, 5.6vw, 52px) * var(--type-scale));
  line-height: 1.14; letter-spacing: -0.02em; margin: 0; overflow-wrap: anywhere; }
.say.dense { font-size: calc(clamp(24px, 3.9vw, 34px) * var(--type-scale)); line-height: 1.35; letter-spacing: -0.01em; }
.say em { font-style: italic; color: var(--accent); }
.say em[lang] { font-style: normal; }
.quiet .blank { font-family: var(--font-serif); font-size: calc(clamp(24px, 3.9vw, 34px) * var(--type-scale)); }
.w { display: inline-block; animation: assemble var(--t-word) ease-out both; }
@keyframes assemble { from { opacity: 0; transform: translateY(.35em); } to { opacity: 1; transform: none; } }
.count { font-variant-numeric: tabular-nums; color: var(--accent); font-style: italic; }

/* a blank: a word in the sentence the reader taps or types */
.blank { font: inherit; letter-spacing: inherit; color: var(--text-dim); background: none; border: 0;
  border-bottom: 1px solid var(--border-strong); padding: 2px .06em; margin: 0; cursor: pointer;
  transition: color var(--t-fast), border-color var(--t-fast), opacity var(--t-fast); }
.blank:hover { color: var(--text); }
.blank:active { opacity: .7; }
.blank[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); }
input.blank, select.blank { cursor: text; color: var(--accent); border-bottom-color: var(--accent-dim); border-radius: 0;
  -webkit-appearance: none; appearance: none; }
input.blank:focus, select.blank:focus { outline: none; border-bottom-color: var(--accent); }
input.blank::placeholder { color: var(--text-dim); font-style: italic; }
input.blank.hour { width: 1.6em; text-align: center; -moz-appearance: textfield; }
input.blank.hour::-webkit-inner-spin-button, input.blank.hour::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input.blank.wide { width: min(100%, 9em); }
input.blank[aria-invalid="true"] { border-bottom-color: var(--warn); }
select.blank { cursor: pointer; background: none; padding-right: .1em; max-width: 100%; }
select.blank option { font-family: var(--font-sans); font-size: 16px; background: var(--bg-elev); color: var(--text); }

.rows { display: grid; gap: var(--s-2); margin-top: var(--s-6); }
.rows p { margin: 0; }
.quiet { display: flex; gap: var(--s-8); margin-top: var(--s-8); flex-wrap: wrap; }
.hint { font-size: calc(14px * var(--type-scale)); line-height: 1.5; color: var(--text-dim); margin: var(--s-4) 0 0; }
.hint.warn { color: var(--warn); }
.log { margin: var(--s-6) 0 0; padding: 0; list-style: none; font-family: var(--font-mono);
  font-size: calc(14px * var(--type-scale)); color: var(--text-dim); font-variant-numeric: tabular-nums; display: grid; gap: var(--s-1); }

.nav { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-3); margin-top: var(--s-12); }
.nav .grow { flex: 1; }
.btn { height: 44px; padding: 0 var(--s-5); font-family: var(--font-mono); font-weight: 500; font-size: calc(12px * var(--type-scale));
  text-transform: uppercase; letter-spacing: .1em; border-radius: var(--r-control); border: 1px solid transparent; cursor: pointer;
  transition: background-color var(--t-fast), color var(--t-fast), border-color var(--t-fast), opacity var(--t-fast); }
.btn.primary { background: var(--accent); color: var(--bg); }
.btn.primary:hover { background: #d4ff66; }
.btn.secondary { background: var(--surface-2); border-color: var(--border-strong); color: var(--text-dim); }
.btn.secondary:hover { color: var(--text); }
.btn:active { opacity: .7; }
.btn:disabled { opacity: .4; cursor: default; }

/* the first issue, small */
.issue { margin-top: var(--s-12); border-top: 1px solid var(--border); padding-top: var(--s-8); }
.issue.appear { animation: fade 600ms ease-out both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.issue-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-4); margin-bottom: var(--s-6); }
.issue-title { font-family: var(--font-serif); font-size: calc(clamp(40px, 6vw, 56px) * var(--type-scale)); line-height: .92; letter-spacing: -0.04em; margin: 0; }
.data { font-family: var(--font-mono); font-size: calc(14px * var(--type-scale)); font-variant-numeric: tabular-nums; color: var(--text-dim); }
.explain { margin: 0 0 var(--s-8); }
.layer { margin-top: var(--s-8); }
.marker { display: flex; align-items: center; gap: var(--s-3); margin: 0 0 var(--s-4); }
.marker::before { content: ""; width: 24px; height: 1px; background: var(--accent); }
.item { background: var(--bg-elev); border: 1px solid var(--border); padding: var(--s-4) var(--s-5); display: grid; gap: var(--s-1); }
.item + .item { border-top: 0; }
.item h3 { font-size: calc(18px * var(--type-scale)); font-weight: 600; line-height: 1.3; margin: 0; }
.item.pebble h3 { font-size: calc(19px * var(--type-scale)); }
.item p { margin: 0; font-size: calc(14px * var(--type-scale)); line-height: 1.5; color: var(--text-dim); }
.water { border: 1px solid var(--border); background: var(--bg-elev); }
.water div { display: flex; justify-content: space-between; gap: var(--s-4); padding: var(--s-3) var(--s-5); border-bottom: 1px solid var(--border);
  font-size: calc(14px * var(--type-scale)); line-height: 1.5; }
.water div:last-child { border-bottom: 0; }
.water .label { flex: none; }
.empty { font-size: calc(14px * var(--type-scale)); color: var(--text-dim); margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<main class="page">
  <div class="top"><span class="brand"><i aria-hidden="true"></i>Cyris</span><span class="label" id="progress"></span></div>
  <div class="letter" id="letter" aria-label="The letter so far"></div>
  <div class="stage" id="stage" aria-live="polite"></div>
</main>
<script>
"use strict";
const RM = window.matchMedia("(prefers-reduced-motion: reduce)");

/* ---- fake data: names and topics from src/cyris/onboarding_feeds.json ---- */
const TOPICS = [
  { id: "tech", label: "Technology" },
  { id: "business", label: "Business & economy" },
  { id: "world", label: "World" },
  { id: "taiwan", label: "Taiwan" },
  { id: "science", label: "Science & health" },
  { id: "ideas", label: "Ideas & culture" },
];
const FEEDS = {
  tech: ["iThome", "科技新報", "數位時代", "Hacker News", "Stratechery", "Simon Willison's Weblog"],
  business: ["經濟日報", "The Economist", "Financial Times", "市場先生", "Noahpinion"],
  world: ["BBC中文網 繁體", "端傳媒", "The Guardian", "NPR", "The Diplomat"],
  taiwan: ["報導者", "中央社即時新聞 政治新聞", "公視新聞網", "自由時報", "關鍵評論網", "台灣事實查核中心"],
  science: ["泛科學 PanSci", "CASE 報科學", "Quanta Magazine", "Nautilus", "Terence Tao"],
  ideas: ["換日線", "Aeon", "The Marginalian", "The Atlantic Ideas", "Literary Hub"],
};
const STANCE_POOL = {
  tech: ["台積電美國廠", "AI 代理", "開源授權"],
  business: ["美國關稅", "央行利率", "輝達財報"],
  world: ["烏克蘭停火談判", "美中晶片管制", "加薩人道走廊"],
  taiwan: ["總預算審查", "罷免投票", "健保費率調整"],
  science: ["登革熱疫情", "減重藥物", "韋伯望遠鏡"],
  ideas: ["獨立書店", "長照人力", "AI 與著作權"],
};
const TITLES = {
  tech: ["企業導入 AI 代理的第一年：權限管理成最大瓶頸", "亞利桑那二廠提前量產，良率仍落後台南", "開源授權改版爭議：社群為何出走"],
  business: ["關稅上路三個月：台灣出口商怎麼調整供應鏈", "央行按兵不動，房市信用管制再收緊", "輝達財報優於預期，伺服器供應鏈訂單看到明年"],
  world: ["停火談判第二輪：雙方在哪些條件上仍有分歧", "美中晶片管制再升級，東南亞封測廠受惠", "人道走廊重開，聯合國物資車隊進入北部"],
  taiwan: ["山區部落的最後一哩路：偏鄉醫療的十年", "總預算審查卡關，地方建設經費延宕", "健保費率調整案：誰多付、誰少付"],
  science: ["登革熱南部疫情升溫，專家：社區孳生源是關鍵", "減重藥物的長期數據：停藥後會怎樣", "韋伯望遠鏡看見最早的星系團"],
  ideas: ["獨立書店的第三種活法", "長照人力缺口：移工之外還有什麼路", "生成式 AI 與著作權：法院怎麼看"],
};
const LANGS = ["Traditional Chinese", "Simplified Chinese", "English", "Japanese"];
const LANG_TAG = { "Traditional Chinese": "zh-Hant", "Simplified Chinese": "zh-Hans", English: "en", Japanese: "ja" };

function hash(s) { let h = 7; for (const c of s) h = (h * 31 + c.codePointAt(0)) % 9973; return h; }
function newCount(name) { return 3 + hash(name) % 14; }
function topicOf(name) { return TOPICS.find(t => FEEDS[t.id].includes(name))?.id || "tech"; }
function isLatin(s) { return /^[\x00-\x7f’]+$/.test(s); }

/* ---- state; a step opened by hash fills in what the steps before it would have ---- */
const STEPS = ["opening", "topics", "feeds", "lanes", "fetch", "stances", "issue", "settings"];
const PROGRESS = { opening: 1, topics: 2, feeds: 2, lanes: 3, fetch: 4, stances: 5, issue: 6, settings: 7 };
function detectLang() {
  const l = (navigator.language || "en").toLowerCase();
  if (/^zh-(tw|hk|mo|hant)/.test(l)) return "Traditional Chinese";
  if (l.startsWith("zh")) return "Simplified Chinese";
  if (l.startsWith("ja")) return "Japanese";
  return "English";
}
const S = {
  topics: null, feeds: null, own: [], whole: null, fetched: false,
  stances: {}, sIdx: 0, issued: false, done: false,
  hours: [8, 18], lang: detectLang(),
  tz: Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC", discord: "", email: "",
};
function ensure(step) {
  const i = STEPS.indexOf(step);
  if (i > 1 && S.topics === null) S.topics = ["taiwan", "tech"];
  if (i > 2 && S.feeds === null) S.feeds = ["報導者", "公視新聞網", "關鍵評論網", "iThome", "Stratechery", "數位時代"];
  if (i > 3 && S.whole === null) S.whole = { "報導者": true, "Stratechery": true };
  if (i > 4) S.fetched = true;
  if (i > 6) S.issued = true;
}
const chosenTopics = () => S.topics || [];
const pickedFeeds = () => [...(S.feeds || []), ...S.own];
const wholeFeeds = () => pickedFeeds().filter(f => S.whole && S.whole[f]);
function stanceTopics() {
  const ids = chosenTopics().length ? chosenTopics() : ["taiwan", "tech"];
  const out = [];
  for (let r = 0; out.length < 6 && r < 3; r++) for (const id of ids) if (out.length < 6) out.push(STANCE_POOL[id][r]);
  for (const t of TOPICS) for (const s of STANCE_POOL[t.id]) if (out.length < 6 && !out.includes(s)) out.push(s);
  return out;
}

/* ---- the letter: each answered step condensed to one line ---- */
function list(xs, max) {
  const shown = xs.slice(0, max), rest = xs.length - shown.length;
  if (rest > 0) return shown.join(", ") + " and " + rest + " more";
  return shown.length > 1 ? shown.slice(0, -1).join(", ") + " and " + shown[shown.length - 1] : shown[0] || "";
}
function lineFor(step) {
  switch (step) {
    case "opening": return "Ninety in, a dozen out.";
    case "topics": return chosenTopics().length ? "You follow " + list(chosenTopics().map(id => TOPICS.find(t => t.id === id).label), 3) + "." : "No topics yet; you'll bring your own feeds.";
    case "feeds": return pickedFeeds().length ? "I’ll watch " + list(pickedFeeds(), 3) + " for you." : "No feeds yet.";
    case "lanes": { const w = wholeFeeds(); return w.length ? "Whole: " + list(w, 3) + ". The rest, a line each." : "Everything in a line; nothing whole."; }
    case "fetch": return "I read " + pickedFeeds().reduce((n, f) => n + newCount(f), 0) + " new articles.";
    case "stances": {
      const m = Object.keys(S.stances).filter(k => S.stances[k] === "more"), l = Object.keys(S.stances).filter(k => S.stances[k] === "less");
      if (!m.length && !l.length) return "No leanings yet; I'll learn them as you read.";
      return [m.length ? "More " + m.join(", ") : "", l.length ? "less " + l.join(", ") : ""].filter(Boolean).join("; ") + ".";
    }
    case "issue": { const p = issueParts(); return "Your first issue: " + p.whole.length + " pebbles, " + p.sand.length + " sand, " + p.skim.length + " water."; }
    case "settings": return "P.S. " + pad(S.hours[0]) + " and " + pad(S.hours[1]) + ", in " + S.lang + ", " + S.tz + " time.";
  }
}
const pad = h => String(h).padStart(2, "0") + ":00";

let arriving = false, timers = [];
function later(fn, ms) { const t = setTimeout(fn, RM.matches ? 0 : ms); timers.push(t); return t; }
function clearTimers() { timers.forEach(clearTimeout); timers = []; }

function renderLetter(step) {
  const i = STEPS.indexOf(step), el = document.getElementById("letter");
  el.textContent = "";
  const lines = STEPS.slice(0, i).map(lineFor);
  if (step === "stances" && Object.keys(S.stances).length) lines.push(lineFor("stances"));
  if (step === "settings" && S.done) lines.push(lineFor("settings"));
  if (lines.length) { const p = document.createElement("p"); p.className = "salute"; p.textContent = "Dear reader,"; el.append(p); }
  lines.forEach((t, k) => {
    const p = document.createElement("p");
    p.append(...mixLang(t));
    if (arriving && k === lines.length - 1) p.className = "arrive";
    el.append(p);
  });
  const full = step === "issue" || (step === "settings" && S.done);
  if (step === "issue" && S.issued || (step === "settings" && S.done)) {
    const p = document.createElement("p"); p.className = "sign"; p.textContent = "Your editor, cyris"; el.append(p);
  }
  el.classList.toggle("capped", !full);
  arriving = false;
}
/* split a sentence so CJK runs carry their own lang, as ui-language §1.7 asks */
function mixLang(t) {
  return t.split(/([　-鿿＀-￯][　-鿿＀-￯\s\w]*)/).filter(Boolean).map(seg => {
    if (/[　-鿿]/.test(seg)) { const s = document.createElement("span"); s.lang = ""; s.textContent = seg; return s; }
    return document.createTextNode(seg);
  });
}

/* ---- a sentence that assembles word by word; nodes in it are single words ---- */
function sentence(parts, cls) {
  const el = document.createElement("p");
  el.className = "say" + (cls ? " " + cls : "");
  let n = 0;
  const word = node => {
    const w = document.createElement("span"); w.className = "w";
    w.style.animationDelay = (n++ * 45) + "ms";
    w.append(node); el.append(w);
  };
  for (const part of parts) {
    if (typeof part === "string") {
      part.split(/(\s+)/).forEach(tok => {
        if (!tok) return;
        if (/^\s+$/.test(tok)) el.append(" ");
        else word(document.createTextNode(tok));
      });
    } else word(part);
  }
  el.assembledIn = RM.matches ? 0 : n * 45 + 520;
  return el;
}
function blankBtn(text, pressed, onTap, lang) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "blank"; b.textContent = text;
  if (lang !== undefined) b.lang = lang;
  if (pressed !== null) b.setAttribute("aria-pressed", String(!!pressed));
  b.addEventListener("click", () => onTap(b));
  return b;
}
function btn(text, kind, onTap) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "btn " + kind; b.textContent = text;
  b.addEventListener("click", onTap); return b;
}
function hint(text, cls) { const p = document.createElement("p"); p.className = "hint" + (cls ? " " + cls : ""); p.textContent = text; return p; }
function nav(step, primary) {
  const n = document.createElement("div"); n.className = "nav";
  const i = STEPS.indexOf(step);
  if (i > 0) n.append(btn("Back", "secondary", () => go(STEPS[i - 1], false)));
  if (step !== "settings") n.append(btn("Skip", "secondary", () => skip(step)));
  const g = document.createElement("span"); g.className = "grow"; n.append(g);
  if (primary) n.append(primary);
  return n;
}

/* ---- moving between steps: the sentence condenses, a line joins the letter ---- */
function go(step, forward) {
  const stage = document.getElementById("stage");
  if (forward && !RM.matches) {
    stage.classList.add("leaving");
    setTimeout(() => { arriving = true; setHash(step); }, 260);
  } else { arriving = !!forward; setHash(step); }
}
function setHash(step) { if (location.hash === "#" + step) render(); else location.hash = step; }
function next(step) { go(STEPS[STEPS.indexOf(step) + 1], true); }
function skip(step) {
  if (step === "topics" && S.topics === null) S.topics = [];
  if (step === "feeds" && S.feeds === null) S.feeds = [];
  if (step === "lanes" && S.whole === null) S.whole = {};
  if (step === "fetch") S.fetched = true;
  if (step === "issue") S.issued = true;
  next(step);
}

/* ---- the steps ---- */
const VIEW = {
  opening(stage) {
    const count = document.createElement("span"); count.className = "count"; count.textContent = "90";
    const s = sentence(["Every day, about ninety articles reach your feeds. I’ll keep the ", count, " worth your time."]);
    stage.append(s);
    const sr = document.createElement("p"); sr.className = "sr"; sr.textContent = "I'll keep the twelve worth your time."; stage.append(sr);
    if (RM.matches) count.textContent = "12";
    else later(() => {
      let v = 90; const tick = () => { v -= v > 40 ? 4 : v > 20 ? 2 : 1; count.textContent = String(Math.max(v, 12)); if (v > 12) later(tick, 40 + (90 - v) * 1.4); };
      tick();
    }, s.assembledIn);
    stage.append(nav("opening", btn("Begin", "primary", () => next("opening"))));
  },
  topics(stage) {
    if (S.topics === null) S.topics = [];
    const parts = ["What do you follow? "];
    TOPICS.forEach((t, k) => {
      parts.push(blankBtn(t.label, S.topics.includes(t.id), b => {
        const on = b.getAttribute("aria-pressed") !== "true";
        b.setAttribute("aria-pressed", String(on));
        S.topics = TOPICS.filter(x => x.id === t.id ? on : S.topics.includes(x.id)).map(x => x.id);
        S.feeds = null; S.whole = null;
      }));
      parts.push(k < TOPICS.length - 2 ? ", " : k === TOPICS.length - 2 ? " or " : ".");
    });
    stage.append(sentence(parts));
    stage.append(hint("Tap the ones you follow. With none, you can bring your own feeds next."));
    stage.append(nav("topics", btn("These", "primary", () => next("topics"))));
  },
  feeds(stage) {
    const names = [...new Set(chosenTopics().flatMap(id => FEEDS[id]))];
    if (S.feeds === null) S.feeds = [];
    const parts = [names.length ? "Then I’ll read " : "Give me a feed to read: "];
    names.forEach((f, k) => {
      parts.push(blankBtn(f, S.feeds.includes(f), b => {
        const on = b.getAttribute("aria-pressed") !== "true";
        b.setAttribute("aria-pressed", String(on));
        S.feeds = on ? [...S.feeds, f] : S.feeds.filter(x => x !== f);
        S.whole = null; count();
      }, isLatin(f) ? undefined : ""));
      parts.push(k < names.length - 1 ? ", " : " ");
    });
    S.own.forEach(f => parts.push(blankBtn(f, true, () => { S.own = S.own.filter(x => x !== f); render(); }), ", "));
    const own = document.createElement("input");
    own.className = "blank wide"; own.type = "url"; own.placeholder = names.length ? "or one of yours" : "paste a feed address";
    own.setAttribute("aria-label", "Add your own feed");
    parts.push(own, ".");
    stage.append(sentence(parts, "dense"));
    const counter = hint(""); counter.setAttribute("aria-live", "polite"); stage.append(counter);
    const count = () => { const n = pickedFeeds().length; counter.textContent = n ? n + (n === 1 ? " feed" : " feeds") + " picked." + (n > 12 ? " Past 12, my first read takes longer than a minute." : "") : "Tap the feeds you want. Press Enter after an address to add it."; };
    count();
    own.addEventListener("keydown", e => {
      if (e.key !== "Enter") return;
      const v = own.value.trim();
      if (!/^https?:\/\/[^\s.]+\.[^\s]+$/.test(v)) { own.setAttribute("aria-invalid", "true"); counter.textContent = "That doesn't look like a feed address. It starts with https://."; counter.classList.add("warn"); return; }
      S.own.push(new URL(v).hostname.replace(/^www\./, "")); S.whole = null; render();
    });
    own.addEventListener("input", () => { own.removeAttribute("aria-invalid"); counter.classList.remove("warn"); });
    stage.append(nav("feeds", btn("Read these", "primary", () => next("feeds"))));
  },
  lanes(stage) {
    const feeds = pickedFeeds();
    if (S.whole === null) S.whole = {};
    stage.append(sentence(["Some you’ll want whole. The rest I’ll hand you in a line."]));
    const rows = document.createElement("div"); rows.className = "rows";
    if (!feeds.length) rows.append(hint("No feeds picked, so nothing to hand you yet. Go Back to pick some."));
    feeds.forEach((f, k) => {
      const name = document.createElement("span"); name.textContent = f; if (!isLatin(f)) name.lang = "";
      const choice = blankBtn(S.whole[f] ? "the whole piece" : "a line", null, b => {
        S.whole[f] = !S.whole[f];
        b.textContent = S.whole[f] ? "the whole piece" : "a line";
        b.setAttribute("aria-label", f + ": " + b.textContent + ". Tap to change.");
      });
      choice.setAttribute("aria-label", f + ": " + choice.textContent + ". Tap to change.");
      const p = sentence([name, ": I’ll hand you ", choice, "."], "dense");
      p.querySelectorAll(".w").forEach((w, j) => w.style.animationDelay = (k * 90 + j * 30) + "ms");
      rows.append(p);
    });
    stage.append(rows);
    stage.append(hint("Tap “a line” to read a feed whole. What you read whole I set as pebbles; the rest becomes sand or water."));
    stage.append(nav("lanes", btn("That’s right", "primary", () => next("lanes"))));
  },
  fetch(stage) {
    const feeds = pickedFeeds();
    const total = feeds.reduce((n, f) => n + newCount(f), 0);
    const lines = feeds.map(f => ["Reading ", f, "… " + newCount(f) + " new."]);
    const box = document.createElement("div"); stage.append(box);
    const log = document.createElement("ol"); log.className = "log"; log.setAttribute("aria-label", "What I read");
    const primary = btn("Go on", "primary", () => { S.fetched = true; next("fetch"); });
    const say = (parts) => { box.textContent = ""; box.append(sentence(parts.map(p => p === parts[1] && parts.length === 3 ? span(p) : p))); };
    const logLine = (l) => { const li = document.createElement("li"); li.append(...mixLang(l.join(""))); log.append(li); };
    const finish = () => { S.fetched = true; say(["I read " + total + " new articles from " + feeds.length + (feeds.length === 1 ? " feed." : " feeds.")]); };
    stage.append(log);
    stage.append(nav("fetch", primary));
    if (!feeds.length) { box.append(sentence(["Nothing to read yet: no feeds picked."])); return; }
    if (S.fetched) { lines.forEach(logLine); finish(); return; }
    const per = 8000 / lines.length;
    lines.forEach((l, k) => later(() => { say(l); if (k) logLine(lines[k - 1]); }, k * per));
    later(() => { logLine(lines[lines.length - 1]); finish(); }, 8000);
  },
  stances(stage) {
    const topics = stanceTopics();
    if (S.sIdx >= topics.length) S.sIdx = 0;
    const t = topics[S.sIdx];
    const topic = document.createElement("em"); topic.lang = ""; topic.textContent = t;
    stage.append(sentence(["More of ", topic, "?"]));
    const q = document.createElement("div"); q.className = "quiet";
    const answer = v => () => {
      S.stances[t] = v;
      if (S.sIdx + 1 < topics.length) { S.sIdx++; go("stances", true); }
      else { S.sIdx = 0; next("stances"); }
    };
    q.append(sayBtn("More, please.", S.stances[t] === "more", answer("more")), sayBtn("Less.", S.stances[t] === "less", answer("less")));
    stage.append(q);
    stage.append(hint((S.sIdx + 1) + " of " + topics.length + ", from what I just read. Skip leaves the rest unanswered; that counts for nothing."));
    stage.append(nav("stances", null));
  },
  issue(stage) {
    const box = document.createElement("div"); stage.append(box);
    const primary = btn("One more thing", "primary", () => next("issue"));
    const n = nav("issue", primary); stage.append(n);
    const reveal = () => {
      S.issued = true; renderLetter("issue");
      box.textContent = "";
      const said = sentence(["Here is your first issue."]); box.append(said);
      later(() => { const issue = buildIssue(); if (!RM.matches) issue.classList.add("appear"); stage.insertBefore(issue, n); }, said.assembledIn);
    };
    if (S.issued) { reveal(); return; }
    const w = wholeFeeds(), more = Object.keys(S.stances).filter(k => S.stances[k] === "more");
    const sandTopic = more[0] || stanceTopics()[0];
    const lines = [
      ["Sorting " + pickedFeeds().reduce((n, f) => n + newCount(f), 0) + " articles."],
      ["Setting aside the ones you won’t miss."],
      w.length ? ["Setting a pebble: ", span(w[0]), ", the whole piece."] : ["No pebbles today: you asked for nothing whole."],
      ["Pouring sand: four articles on ", span(sandTopic), ", one line."],
      ["Letting the water run: single headlines, one row each."],
      ["Signing the letter."],
    ];
    const per = 12000 / lines.length;
    lines.forEach((l, k) => later(() => { box.textContent = ""; box.append(sentence(l)); }, k * per));
    later(reveal, 12000);
  },
  settings(stage) {
    if (S.done) {
      stage.append(sentence(["Until ", span(pad(S.hours[0])), ", then."]));
      stage.append(hint("This prototype ends here. In the product, Finish opens Settings."));
      stage.append(nav("settings", btn("Change the P.S.", "secondary", () => { S.done = false; render(); })));
      return;
    }
    const hourIn = k => {
      const i = document.createElement("input"); i.className = "blank hour"; i.type = "number"; i.min = "0"; i.max = "23"; i.inputMode = "numeric";
      i.value = String(S.hours[k]); i.setAttribute("aria-label", k ? "Second publish hour" : "First publish hour");
      i.addEventListener("input", () => { const v = Number(i.value); const ok = i.value !== "" && v >= 0 && v <= 23 && Number.isInteger(v); i.toggleAttribute("aria-invalid", !ok); if (ok) S.hours[k] = v; });
      return i;
    };
    const sel = (opts, val, label, onPick) => {
      const s = document.createElement("select"); s.className = "blank"; s.setAttribute("aria-label", label);
      opts.forEach(o => s.append(new Option(o, o, false, o === val)));
      const fit = () => s.style.width = (s.value.length * 0.36 + 0.5) + "em";
      s.addEventListener("change", () => { onPick(s.value); fit(); }); fit(); return s;
    };
    const zones = [...new Set([S.tz, "Asia/Taipei", "Asia/Tokyo", "Europe/London", "America/New_York", "America/Los_Angeles", "UTC"])];
    const text = (type, ph, key, label) => {
      const i = document.createElement("input"); i.className = "blank wide"; i.type = type; i.placeholder = ph; i.value = S[key];
      i.setAttribute("aria-label", label); i.addEventListener("input", () => S[key] = i.value.trim()); return i;
    };
    stage.append(sentence(["P.S. Each day at ", hourIn(0), " and ", hourIn(1), ", in ",
      sel(LANGS, S.lang, "Output language", v => S.lang = v), ", on ",
      sel(zones, S.tz, "Timezone", v => S.tz = v), " time, I’ll write you what’s worth reading. I can also tell ",
      text("url", "a Discord webhook", "discord", "Discord webhook"), " or ", text("email", "your email", "email", "Email"), "."], "dense"));
    stage.append(hint("Language and timezone came from this browser. Everything here is optional."));
    const err = hint("", "warn"); err.setAttribute("role", "status"); stage.append(err);
    stage.append(nav("settings", btn("Sign the letter", "primary", () => {
      if (stage.querySelector("[aria-invalid]")) { err.textContent = "A publish hour is a whole number from 0 to 23."; return; }
      S.done = true; arriving = true;
      const st = document.getElementById("stage");
      if (RM.matches) render(); else { st.classList.add("leaving"); setTimeout(render, 260); }
    })));
  },
};
function span(t) { const s = document.createElement("span"); s.textContent = t; if (!isLatin(t)) s.lang = ""; return s; }
function sayBtn(t, pressed, fn) { const b = blankBtn(t, pressed, fn); b.classList.add("say", "dense"); return b; }

function issueParts() {
  const less = new Set(Object.keys(S.stances).filter(k => S.stances[k] === "less"));
  const more = Object.keys(S.stances).filter(k => S.stances[k] === "more");
  return {
    whole: wholeFeeds().slice(0, 3),
    sand: [...new Set([...more, ...stanceTopics()])].filter(t => !less.has(t)).slice(0, 2),
    skim: pickedFeeds().filter(f => !(S.whole && S.whole[f])).slice(0, 5),
  };
}
function buildIssue() {
  const lang = LANG_TAG[S.lang] || "zh-Hant";
  const sec = document.createElement("section"); sec.className = "issue"; sec.setAttribute("aria-label", "Your first issue");
  const head = document.createElement("div"); head.className = "issue-head";
  const h = document.createElement("h2"); h.className = "issue-title"; h.textContent = "Issue one";
  const d = document.createElement("span"); d.className = "data"; d.textContent = new Date().toISOString().slice(0, 10);
  head.append(h, d); sec.append(head);
  const ex = document.createElement("p"); ex.className = "say dense explain";
  ex.textContent = "Pebbles are what you read whole, sand is many articles on one topic in a line, and water is the single headlines you can let run past.";
  sec.append(ex);
  const layer = (name, n) => { const l = document.createElement("div"); l.className = "layer"; const m = document.createElement("h3"); m.className = "marker label"; m.textContent = name + " · " + n; l.append(m); sec.append(l); return l; };
  const { whole, sand: sandTopics, skim } = issueParts();
  const pebbles = layer("Pebbles", whole.length);
  if (!whole.length) { const p = document.createElement("p"); p.className = "empty"; p.textContent = "None: you asked for nothing whole. Mark a feed “the whole piece” and its articles land here."; pebbles.append(p); }
  whole.slice(0, 3).forEach((f, k) => {
    const it = document.createElement("article"); it.className = "item pebble";
    it.innerHTML = '<span class="label"></span><h3 lang=""></h3><p></p>';
    it.querySelector(".label").textContent = f;
    const pool = TITLES[topicOf(f)]; it.querySelector("h3").textContent = pool[(hash(f) + k) % pool.length];
    const p = it.querySelector("p"); p.lang = lang; p.textContent = lang === "en" ? "A summary of the whole piece, written for you." : "整篇讀完後替你寫的摘要：重點、脈絡與值得細讀的段落。";
    pebbles.append(it);
  });
  const sand = layer("Sand", sandTopics.length);
  sandTopics.forEach((t, k) => {
    const it = document.createElement("article"); it.className = "item";
    it.innerHTML = '<h3></h3><p></p><span class="label"></span>';
    it.querySelector("h3").textContent = t; it.querySelector("h3").lang = lang;
    const p = it.querySelector("p"); p.lang = lang; p.textContent = lang === "en" ? "Four outlets on one development, told once." : "四家媒體報導同一進展，合成一句話告訴你。";
    it.querySelector(".label").textContent = (4 - k) + " articles";
    sand.append(it);
  });
  const water = layer("Water", skim.length);
  const wl = document.createElement("div"); wl.className = "water";
  skim.forEach((f, k) => {
    const r = document.createElement("div");
    const t = document.createElement("span"); t.lang = ""; const pool = TITLES[topicOf(f)]; t.textContent = pool[(hash(f) + k + 1) % pool.length];
    const s = document.createElement("span"); s.className = "label"; s.textContent = f;
    r.append(t, s); wl.append(r);
  });
  if (skim.length) water.append(wl);
  return sec;
}

function render() {
  clearTimers();
  let step = location.hash.slice(1);
  if (!STEPS.includes(step)) step = "opening";
  ensure(step);
  document.getElementById("progress").textContent = PROGRESS[step] + " of 7";
  renderLetter(step);
  const stage = document.getElementById("stage");
  stage.classList.remove("leaving"); stage.textContent = "";
  VIEW[step](stage);
}
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
