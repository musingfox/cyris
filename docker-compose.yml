services:
  cyris:
    build: .
    env_file: .env
    environment:
      - TZ=${TZ:-Asia/Taipei}
      - CYRIS_AGENT_VAULT_PATH=/data/agent-vault
    volumes:
      # Single-file mounts bind an inode, and editors replace files by rename, so
      # editing either of these leaves the container reading a deleted inode
      # (`-?????????`, ENOENT) until you `docker compose up -d --force-recreate cyris`.
      # Plain `up -d` won't do it: compose sees no config change and leaves it running.
      - ./cyris.toml:/app/cyris.toml:ro
      - ./sources.yaml:/app/sources.yaml:ro
      - ./agent-vault:/data/agent-vault
      # [html_output] output_dir is relative to cwd (/app), so it lands outside
      # /data and every container recreate wiped the archive. Mount it back.
      - ./agent-vault/html:/app/agent-vault/html
    restart: unless-stopped
