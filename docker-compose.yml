services:
  cyris:
    build: .
    env_file: .env
    environment:
      - TZ=${TZ:-Asia/Taipei}
      # The cron role exports nothing, so the backend is set here, as on `ui`. A
      # `[store] backend` line in cyris.toml beats it.
      - CYRIS_STORE_BACKEND=${CYRIS_STORE_BACKEND:-sqlite}
    volumes:
      # A single-file mount binds an inode, and editors replace files by rename, so
      # editing this leaves the container reading a deleted inode
      # (`-?????????`, ENOENT) until you `docker compose up -d --force-recreate`.
      # Plain `up -d` won't do it: compose sees no config change and leaves it running.
      - ./cyris.toml:/app/cyris.toml:ro
      # The generated HTML. Inside the container it would go with it on the next recreate.
      - ./agent-vault:/app/agent-vault
      # The SQLite file (`[store] sqlite_path`, default state/cyris.sqlite3, under /app).
      # A named volume, never a bind mount: a macOS host process and a container on one
      # bind-mounted SQLite file corrupt it (ADR-0025), so no host path may reach it.
      - cyris-state:/app/state
    restart: unless-stopped

  # The archive and /settings. The role listens on every address inside the container,
  # so the published address is the boundary: this machine only. Publishing another address
  # would hand them to the network, with no sign-in in front of them.
  ui:
    build: .
    env_file: .env
    environment:
      - TZ=${TZ:-Asia/Taipei}
      - CYRIS_ROLE=ui
      # The role's default is the Cloudflare deployment's d1.
      - CYRIS_STORE_BACKEND=${CYRIS_STORE_BACKEND:-sqlite}
    ports:
      # The host port is the only thing the environment may change.
      - "127.0.0.1:${CYRIS_UI_PORT:-8766}:8766"
    volumes:
      - ./cyris.toml:/app/cyris.toml:ro
      # Writable: the wizard's last step (`POST /run`) starts a run inside this container,
      # and the run writes agent-vault/html/.
      - ./agent-vault:/app/agent-vault
      - cyris-state:/app/state
    restart: unless-stopped

volumes:
  cyris-state:
