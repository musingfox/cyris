services:
  miniflux:
    image: miniflux/miniflux:latest
    ports:
      - "8085:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://miniflux:${POSTGRES_PASSWORD:-secret}@db/miniflux?sslmode=disable
      - RUN_MIGRATIONS=1
      - CREATE_ADMIN=1
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=${MINIFLUX_ADMIN_PASSWORD:-cyris2026}
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=miniflux
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret}
      - POSTGRES_DB=miniflux
    volumes:
      - miniflux-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux"]
      interval: 10s
      start_period: 30s
    restart: unless-stopped

  cyris:
    build: .
    depends_on:
      - miniflux
    env_file: .env
    environment:
      - TZ=${TZ:-Asia/Taipei}
      - CYRIS_MINIFLUX_URL=http://miniflux:8080
      - CYRIS_VAULT_PATH=/vault
      - CYRIS_AGENT_VAULT_PATH=/data/agent-vault
    volumes:
      - ./cyris.toml:/app/cyris.toml:ro
      - ./sources.yaml:/app/sources.yaml:ro
      - ${CYRIS_VAULT_HOST_PATH:-./vault}:/vault
      - ./agent-vault:/data/agent-vault
      # [html_output] output_dir is relative to cwd (/app), so it lands outside
      # /data and every container recreate wiped the archive. Mount it back.
      - ./agent-vault/html:/app/agent-vault/html
    restart: unless-stopped

volumes:
  miniflux-db:
