# Hosted mode: the Worker `cyris-hosted`, a separate deployment from `cyris-app`.
# Many tenants' digests, each run against the tenant's own SQLite Durable Object
# (docs/decisions/0028-one-sqlite-durable-object-per-hosted-tenant.md).
#
# Its own file, not an environment of wrangler.toml: wrangler.toml stays exactly
# what a push to main deploys to production (ADR-0024), and a second environment
# there would make every production deploy warn that none was named. This file
# is deployed by hand to the trial account (docs/hosted-tenants.md), never by a
# workflow: `wrangler deploy --config wrangler.hosted.toml`. It shares no name,
# class, binding, container application or migration with wrangler.toml, which
# tests/test_hosted_config.py holds. It sits at the repo root for the reason
# wrangler.toml does: the image is built from the whole repository.
name = "cyris-hosted"
main = "workers/app/src/hosted.js"
# As wrangler.toml's, so the shared modules run on the same runtime semantics.
compatibility_date = "2026-06-01"
# Before 2026-10-01 a pending ctx.container.monitor() does not keep the object in memory, so an
# object with no request for 70-140 s is evicted mid-run and the run queue never hears the stop
# (the lease ends it 20 minutes later). The flag keeps it for up to 15 minutes per monitor():
# https://developers.cloudflare.com/sandbox/concepts/lifetime/ . Hosted only: wrangler.toml's
# Worker only logs the stop, and its date moves with production.
compatibility_flags = ["durable_object_io_tasks_prevent_eviction"]

# workers.dev only, as a clone of wrangler.toml. The operator's routes check the Access
# JWT themselves (ADR-0015), so the Access application over /hosted/* is what lets the
# operator through, and of those only the identities CYRIS_HOSTED_OPERATORS names, a secret
# hosted.sh sets (ADR-0037); a tenant's pages and the sign-in take a tenant session instead
# (ADR-0033). No Preview URLs: each would be another public hostname.
workers_dev = true
preview_urls = false

# Each tenant's tick asks its own database whether this hour is a digest hour.
[triggers]
crons = ["0 * * * *"]

[[containers]]
# Its own container application and registry repository, never production's.
name = "cyris-hosted-tenantcontainer"
class_name = "TenantContainer"
image = "./Dockerfile"
# How many tenants' runs hold a container at once. The registry's run queue
# starts no more than this (`RUN_SLOTS` in workers/app/src/run_queue.js, which
# tests/test_hosted_config.py holds equal) and the rest wait their turn, so
# raising it for a larger beta is this line and that constant together (ADR-0032).
max_instances = 2
instance_type = "basic"

# One region, the one every tenant database is hinted to (`LOCATION_HINT` in
# workers/app/src/tenant_db.js), so the 123 queries of a run stay in it.
[containers.constraints]
regions = ["WNAM"]

# The container's output is the only log of a tenant's run, as in wrangler.toml.
[observability]
enabled = true

[observability.logs]
invocation_logs = true

[[durable_objects.bindings]]
class_name = "TenantContainer"
name = "TENANT_RUN"

[[durable_objects.bindings]]
class_name = "TenantDb"
name = "TENANT_DB"

# The operator's registry: one object, the tenant list among what it holds, so a
# tenant is a row the operator registers, not a line of this file (ADR-0030).
[[durable_objects.bindings]]
class_name = "TenantRegistry"
name = "REGISTRY"

# The readers' sign-in mail (ADR-0033): Cloudflare Email Service's Workers binding, so the
# Worker holds no API token. No restriction attributes: the recipients are the registry's
# invite list, and the sender is CYRIS_HOSTED_MAIL_FROM, which must be an address on a
# domain the operator onboarded to Email Sending (docs/hosted-tenants.md).
[[send_email]]
name = "MAIL"

# The daily backup's first copy (workers/app/src/hosted_backup.js, ADR-0041): each tenant
# database and the registry, one export each a day under <YYYY-MM-DD>/. Durable Objects have
# point-in-time recovery but no export API, so this bucket is the one copy outside each object on
# Cloudflare; the second is in Backblaze B2, for when the account itself is suspended. The
# operator creates the bucket and its lifecycle rule by hand (docs/hosted-tenants.md): retention
# is that rule, not code.
[[r2_buckets]]
binding = "BACKUP"
bucket_name = "cyris-hosted-backup"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TenantContainer"]

# The tenant databases: one SQLite-backed object per tenant, named by its id.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["TenantDb"]

# The registry: one SQLite-backed object under a fixed name (tenant_registry.js).
[[migrations]]
tag = "v3"
new_sqlite_classes = ["TenantRegistry"]
