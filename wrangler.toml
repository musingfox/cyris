# This file lives at the repo root, not in workers/app/ beside the Worker it
# configures. A Deploy to Cloudflare button treats the directory it points at
# as the whole repository, and this Worker needs two things outside
# workers/app/: the Dockerfile and the Python package it installs. Moving the
# config down would make the button build fail, not tidy anything.
name = "cyris-app"
main = "workers/app/src/index.js"
compatibility_date = "2026-06-01"

# Fork-neutral top level: a clone deploys to *.workers.dev with no account-
# specific hostname or Pages project in this file. Custom domains are attached
# from the Cloudflare dashboard or API — after that, this file is no longer the
# sole source of truth for routing. Preview URLs stay off: each is another
# public hostname.
workers_dev = true
preview_urls = false

# The hourly tick that used to be docker/crontab + supercronic. It is
# unconditional on purpose: `cyris run --if-due` asks D1 whether this hour is a
# digest hour and derives --period from which of the two it is, so changing the
# times stays a settings write rather than a redeploy.
#
# DIGEST_ORIGIN is grade B and deployer-supplied (Worker secret or [vars]), e.g.
#   DIGEST_ORIGIN = "https://<your-pages-project>.pages.dev"
# No default is shipped. Unset, the Worker answers 503 on the public archive.

[triggers]
crons = ["0 * * * *"]

[[containers]]
class_name = "CyrisContainer"
# Relative to this file; its directory is the build context, so the whole repo
# is what the image is built from.
image = "./Dockerfile"
# One digest run and one triage session at a time — this is a single reader's
# deployment, and a second instance would be a second publisher.
max_instances = 2
# ponytail: 1/4 vCPU, 1 GiB. The run is IO-bound (it waits on the LLM, not on
# the CPU), so the ceiling here is memory during scoring. Move to `standard` if
# a run OOMs; the receipt is an exit before the digest, not a slow one.
instance_type = "basic"

# The container's stdout and stderr are this deployment's only log. Without
# this block they are kept nowhere at all — `wrangler tail` shows them live and
# then they are gone, which is why M5's sleep bug had to be chased through
# billing metrics instead. Workers Logs retains them for 7 days on the Paid
# plan, and `run_digest` writes one `run_summary` JSON line per run so that
# window answers "what did last night cost". The permanent record is still D1
# `usage_log` — see docs/architecture.md §4.
[observability]
enabled = true

[observability.logs]
invocation_logs = true

[[durable_objects.bindings]]
class_name = "CyrisContainer"
name = "CYRIS"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CyrisContainer"]
