<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyris Settings</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* Its own page rather than a view inside app.js: the deck is a swipe
       surface with global key and touch handlers, and a form has no business
       sharing them. body there is overflow:hidden, which a form must undo. */
    body { overflow: auto; display: block; padding: 1.5rem; max-width: 34rem; margin: 0 auto; }
    h1 { font-size: 1.2rem; color: var(--text-muted); letter-spacing: .05em; margin-bottom: 1.5rem; }
    fieldset { border: 1px solid var(--card-border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    legend { color: var(--text-muted); font-size: .8rem; padding: 0 .4rem; }
    label.provider { display: flex; align-items: baseline; gap: .6rem; padding: .5rem 0; cursor: pointer; }
    label.provider.unavailable { opacity: .45; cursor: not-allowed; }
    .env { color: var(--text-muted); font-size: .75rem; margin-left: auto; }
    input[type=text] {
      width: 100%; padding: .6rem; border-radius: 6px; font: inherit;
      background: var(--card-bg); color: var(--text); border: 1px solid var(--card-border);
    }
    .hint { color: var(--text-muted); font-size: .78rem; margin-top: .4rem; line-height: 1.5; }
    button {
      background: var(--accent-accept); color: var(--bg); border: 0; border-radius: 6px;
      padding: .7rem 1.4rem; font: inherit; font-weight: 600; cursor: pointer;
    }
    button[disabled] { opacity: .5; cursor: default; }
    #result { margin-top: 1rem; padding: .8rem; border-radius: 6px; font-size: .85rem; line-height: 1.5; white-space: pre-wrap; }
    #result.ok { background: #14342c; color: var(--accent-accept); }
    #result.err { background: #3a1620; color: var(--accent-reject); }
    a.back { color: var(--text-muted); font-size: .8rem; }
  </style>
</head>
<body>
  <h1>LLM PROVIDER</h1>

  <form id="form">
    <fieldset>
      <legend>Provider</legend>
      <div id="providers"></div>
    </fieldset>

    <fieldset>
      <legend>Model</legend>
      <input type="text" id="model" placeholder="leave empty for the provider's default" autocomplete="off">
      <p class="hint" id="model-hint"></p>
    </fieldset>

    <button type="submit" id="save">Save</button>
    <a class="back" href="/" style="margin-left:1rem">&larr; back to triage</a>
  </form>

  <div id="result" class="hidden" hidden></div>

<script>
const $ = (id) => document.getElementById(id);
let state = null;

function render() {
  $("providers").innerHTML = state.providers.map((p) => `
    <label class="provider ${p.configured ? "" : "unavailable"}">
      <input type="radio" name="provider" value="${p.name}"
             ${p.name === state.provider ? "checked" : ""}
             ${p.configured ? "" : "disabled"}>
      <span>${p.name}</span>
      <span class="env">${p.configured ? "key ready" : `${p.env_var} missing`}</span>
    </label>`).join("");
  $("model").value = state.model;
  updateHint();
  $("providers").addEventListener("change", updateHint);
  if (!state.writable) {
    $("save").disabled = true;
    show("err", "This server was started without a config file, so nothing can be saved.");
  }
}

function chosen() {
  const el = document.querySelector('input[name=provider]:checked');
  return el && state.providers.find((p) => p.name === el.value);
}

function updateHint() {
  const p = chosen();
  $("model-hint").textContent = p
    ? `Empty uses ${p.default_model}. Saving checks the model against ${p.name} with a real call first — a typo is rejected here rather than at 08:00 tomorrow.`
    : "Pick a provider whose key is present.";
}

function show(kind, text) {
  const el = $("result");
  el.className = kind;
  el.textContent = text;
  el.hidden = false;
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const p = chosen();
  if (!p) return show("err", "Pick a provider first.");
  $("save").disabled = true;
  show("ok", "Checking with the provider…");
  try {
    const res = await fetch("/api/settings", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({provider: p.name, model: $("model").value.trim()}),
    });
    const data = await res.json();
    if (data.ok) {
      state.provider = data.provider;
      state.model = data.model;
      show("ok", `${data.detail}\n${data.note}`);
    } else {
      show("err", data.error || `HTTP ${res.status}`);
    }
  } catch (err) {
    show("err", String(err));
  } finally {
    $("save").disabled = false;
  }
});

fetch("/api/settings")
  .then((r) => r.json())
  .then((d) => { state = d; render(); })
  .catch((e) => show("err", `Could not load settings: ${e}`));
</script>
</body>
</html>
