name = "cyris-rss"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Hourly poll. Feed snapshots only hold ~2-4h of high-volume sources, so the
# 24h digest window needs an accumulated buffer, not a fetch at digest time.
[triggers]
crons = ["0 * * * *"]

# The id below is a Deploy to Cloudflare default, not a leak. Cloudflare provisions
# a fresh database per deployment and rewrites this field, but it requires the
# repository to ship a working default. Ids are not credentials — without an API
# token scoped to the account they grant nothing. Do not delete it to "clean up":
# an absent id fails the deploy instead of being replaced.
[[d1_databases]]
binding = "DB"
database_name = "cyris-rss"
database_id = "0948e71f-2374-4e4e-8f30-44890139011b"

# Requires Workers Paid. On Free the scheduled handler died with "Exceeded CPU
# Limit" on every tick — parsing ~50 feeds of XML is far past what Free allows.
[limits]
cpu_ms = 300000
