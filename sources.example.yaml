# Source Configuration
# Each source defines an RSS feed or newsletter with its processing lane.
#
# Lanes:
#   skim   - High-volume general news. Most articles discarded; only significant headlines kept.
#   read   - High-quality sources. Scored, then summarized or listed by score (docs/sources.md).
#   follow - Sources you follow as they are. Passed through: never scored, filtered or summarized.
#
# A new deployment starts with no source (docs/decisions/0020-new-deployments-start-from-onboarding.md).
# On a SQLite or D1 deployment this file is not read: /settings sends you to /onboarding, where you pick
# your feeds. On a `json` deployment there is no onboarding, so copy this file to sources.yaml
# and add the feeds you read. Until it lists one, every run ends having fetched nothing,
# waiting for onboarding. src/cyris/onboarding_feeds.json holds the feeds the wizard offers,
# each already in this shape: YAML reads a JSON object as written, so an entry copied from
# there goes in as `- {"name": ..., "url": ...}`.
#
# The commented entries show every shape a source takes: a feed, a language override, and an
# email-only newsletter. Uncomment and edit them, or write your own.

defaults:
  language: auto  # auto-detect, or force: zh, en, ja

sources: []
  # A feed, in a lane other than the default, with tags of your own.
  # - name: "The Verge"
  #   url: "https://www.theverge.com/rss/index.xml"
  #   lane: read
  #   tags: [tech]

  # A feed in a language auto-detection might miss. A `news` tag routes the source's
  # articles into news clustering, where one event reported by several sources is one entry.
  # - name: "報導者"
  #   url: "https://www.twreporter.org/a/rss2.xml"
  #   tags: [news, investigative]
  #   language: zh

  # An email-only newsletter (no RSS), ingested via the Cloudflare newsletter Worker:
  # `type: newsletter` + `email_match` instead of a url; needs the newsletter Worker
  # wired in ([newsletter] worker_url in cyris.toml, or CYRIS_NEWSLETTER_WORKER_URL on
  # the app Worker). Matches incoming mail by From: header.
  # `homepage` is where this newsletter publishes, and it does two jobs. Its host tells
  # the extractor which links in the email are the sender's own, so the issue's canonical link
  # comes from those rather than from whichever domain the issue happens to quote most.
  # And when an issue carries no link at all (some newsletters wrap every href per
  # recipient), it is offered as a reference link so the reader still has somewhere to
  # go. It never becomes the article's own URL: that is the store's dedup key, and a
  # homepage repeated every issue would make later issues look like duplicates.
  # - name: "Some Email Newsletter"
  #   type: newsletter
  #   email_match: "from:newsletter@example.com"
  #   homepage: "https://newsletter.example.com"
  #   lane: read
  #   tags: [newsletter]
